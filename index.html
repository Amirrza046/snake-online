
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071321;color:white;font-family:Tahoma;text-align:center}
header{font-size:27px;font-weight:bold;color:#40f5d0;padding:18px}
.panel{width:94%;max-width:560px;margin:12px auto;padding:15px;background:#12263a;border:1px solid #28536a;border-radius:18px}
h3{color:#40f5d0}
input,select,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:10px;background:#203b52;color:white;font-size:15px}
button{background:#087f78;font-weight:bold}
.hidden{display:none!important}
#gameCanvas{width:100%;height:auto;background:#081522;border:2px solid #40e8c7;border-radius:12px;touch-action:none}
#joystick{width:140px;height:140px;border-radius:50%;background:#19384d;border:2px solid #40f5d0;position:relative;margin:16px auto;touch-action:none}
#knob{width:48px;height:48px;border-radius:50%;background:#40f5d0;position:absolute;left:44px;top:44px;pointer-events:none}
.small{font-size:12px;color:#b4c9d9;line-height:1.8}
#roomCode{direction:ltr;color:#40f5d0;font-size:22px}
#players{line-height:2}
#status{color:#ffdc70}
</style>
</head>
<body>
<header>🐍 SNAKE ARENA</header>

<section id="profile" class="panel hidden">
<h3>پروفایل بازیکن</h3>
<input id="name" maxlength="16" placeholder="نام بازیکن">
<select id="gender">
<option value="">جنسیت</option>
<option>پسر</option><option>دختر</option><option>بدون اعلام</option>
</select>
<button onclick="saveProfile()">ذخیره</button>
</section>

<section id="lobby" class="panel hidden">
<h3>سلام <span id="welcome"></span> 👋</h3>
<button onclick="startSolo()">🎮 بازی با ربات‌ها</button>
<button onclick="createRoom()">ساخت اتاق آنلاین</button>
<input id="roomInput" placeholder="کد اتاق">
<button onclick="joinRoom()">پیوستن به اتاق</button>
</section>

<section id="roomPanel" class="panel hidden">
<h3>🏟️ اتاق بازی</h3>
<div>کد اتاق:</div><div id="roomCode"></div>
<button onclick="copyInvite()">کپی لینک دعوت</button>
<div id="settings" class="hidden">
<select id="mode">
<option value="2">۱ به ۱</option>
<option value="3">۱ به ۲</option>
<option value="4">۲ به ۲</option>
</select>
<select id="duration">
<option value="1">۱ دقیقه</option>
<option value="3">۳ دقیقه</option>
<option value="5" selected>۵ دقیقه</option>
<option value="10">۱۰ دقیقه</option>
</select>
</div>
<h3>بازیکنان</h3>
<div id="players"></div>
<div id="status">در انتظار بازیکنان...</div>
<button id="startButton" class="hidden" onclick="startOnline()">شروع مسابقه</button>
<button onclick="leaveRoom()">خروج</button>
</section>

<section id="gamePanel" class="panel hidden">
<h3>🐍 Snake Arena</h3>
<div id="timer"></div>
<div id="scores"></div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<h3 id="message"></h3>
<div class="small">جوی‌استیک را به هر زاویه‌ای بکش؛ حرکت مار ۳۶۰ درجه است.</div>
<div id="joystick"><div id="knob"></div></div>
<button id="backButton" class="hidden" onclick="backRoom()">بازگشت به اتاق</button>
<button id="homeButton" class="hidden" onclick="leaveRoom()">بازگشت به منو</button>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$("gameCanvas"),ctx=canvas.getContext("2d");
const WIDTH=600,HEIGHT=400;
const TAU=Math.PI*2;
let profile=JSON.parse(localStorage.getItem("snakeProfile")||"null");
let peer=null,connections=[],conn=null;
let isHost=false,solo=false,myId="",roomCode="";
let players=[],game=null;
let moveTimer=null,secondTimer=null,sendTimer=null;
let duration=5,mode=2;

function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function saveProfile(){
 const name=$("name").value.trim(),gender=$("gender").value;
 if(!name||!gender){alert("نام و جنسیت را وارد کن");return}
 profile={name,gender};
 localStorage.setItem("snakeProfile",JSON.stringify(profile));
 openLobby();
}
function openLobby(){
 hide("profile");hide("roomPanel");hide("gamePanel");
 show("lobby");$("welcome").textContent=profile.name;
}
if(profile)openLobby();else show("profile");

function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const a=crypto.getRandomValues(new Uint8Array(10));
 return Array.from(a,v=>chars[v%chars.length]).join("");
}
function getCapacity(){return Number($("mode").value)}
function createRoom(){
 if(!window.Peer){alert("اینترنت را بررسی کن");return}
 if(peer)peer.destroy();
 isHost=true;solo=false;players=[];connections=[];
 roomCode=makeCode();myId="snake-"+roomCode.toLowerCase();
 hide("lobby");show("roomPanel");show("settings");show("startButton");
 $("roomCode").textContent=roomCode;
 $("status").textContent="در حال ساخت اتاق...";
 peer=new Peer(myId);
 peer.on("open",()=>{
  players=[{id:myId,name:profile.name,team:0}];
  renderRoom();$("status").textContent="اتاق آماده است!";
 });
 peer.on("connection",c=>{
  c.on("open",()=>{
   connections.push(c);
   c.on("data",d=>hostReceive(c,d));
   c.on("close",()=>{
    players=players.filter(p=>p.id!==c.peer);
    connections=connections.filter(x=>x!==c);
    renderRoom();
   });
  });
 });
 peer.on("error",e=>$("status").textContent="خطا: "+e.type);
}
function joinRoom(){
 const code=($("roomInput").value||new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
 if(!code){alert("کد اتاق را وارد کن");return}
 if(!window.Peer){alert("اینترنت را بررسی کن");return}
 if(peer)peer.destroy();
 roomCode=code;isHost=false;solo=false;
 hide("lobby");show("roomPanel");hide("settings");hide("startButton");
 $("roomCode").textContent=code;$("status").textContent="در حال اتصال...";
 peer=new Peer();
 peer.on("open",id=>{
  myId=id;
  conn=peer.connect("snake-"+code.toLowerCase(),{reliable:true});
  conn.on("open",()=>conn.send({type:"join",name:profile.name}));
  conn.on("data",guestReceive);
 });
 peer.on("error",e=>$("status").textContent="اتصال برقرار نشد: "+e.type);
}
function hostReceive(c,d){
 if(!d)return;
 if(d.type==="join"){
  if(players.length>=4){c.send({type:"reject"});return}
  if(players.some(p=>p.id===c.peer))return;
  players.push({id:c.peer,name:String(d.name).slice(0,16),team:players.length%2});
  renderRoom();
 }
 if(d.type==="angle"&&game&&!game.over){
  const s=game.snakes.find(x=>x.id===c.peer);
  if(s)s.angle=d.angle;
 }
}
function guestReceive(d){
 if(!d)return;
 if(d.type==="reject"){alert("اتاق پر است");return}
 if(d.type==="room"){
  players=d.players;mode=d.mode;duration=d.duration;renderPlayers();
  $("status").textContent="وارد اتاق شدی!";
 }
 if(d.type==="start"){
  game=d.game;openGame();draw();
 }
 if(d.type==="state"){game=d.game;draw()}
 if(d.type==="end"){game=d.game;draw();$("message").textContent=d.message;show("backButton")}
}
function broadcast(d){
 connections.forEach(c=>{if(c.open)c.send(d)});
}
function renderPlayers(){
 $("players").innerHTML=players.map(p=>esc(p.name)+" — تیم "+(p.team+1)).join("<br>")+
 "<br>بازیکنان: "+players.length+"/4";
}
function renderRoom(){
 renderPlayers();
 if(isHost){
  mode=getCapacity();duration=Number($("duration").value);
  broadcast({type:"room",players,mode,duration});
  const ready=players.length===mode;
  $("startButton").disabled=!ready;
  $("status").textContent=ready?"بازیکنان کامل شدند!":"در انتظار بازیکن...";
 }
}
$("mode").onchange=renderRoom;
$("duration").onchange=renderRoom;

function createSnake(p,i){
 const angle=p.team===0?0:Math.PI;
 const x=p.team===0?120:480;
 const y=90+(i%3)*90;
 const body=[];
 for(let n=0;n<18;n++){
  body.push({x:x-Math.cos(angle)*n*5,y:y-Math.sin(angle)*n*5});
 }
 return {id:p.id,name:p.name,team:p.team,x,y,angle,body,
 alive:true,score:0,length:18,speed:2.2,bot:p.id.startsWith("bot")};
}
function randomFood(){
 let f,tries=0;
 do{
  f={x:Math.random()*WIDTH,y:Math.random()*HEIGHT};
  tries++;
 }while(tries<100&&game.snakes.some(s=>s.body.some(p=>distance(f,p)<15)));
 return f;
}
function distance(a,b){
 let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
 dx=Math.min(dx,WIDTH-dx);dy=Math.min(dy,HEIGHT-dy);
 return Math.hypot(dx,dy);
}
function startSolo(){
 if(peer)peer.destroy();peer=null;conn=null;
 isHost=true;solo=true;myId="solo";
 players=[
  {id:"solo",name:profile.name,team:0},
  {id:"bot1",name:"ربات ۱",team:1},
  {id:"bot2",name:"ربات ۲",team:1},
  {id:"bot3",name:"ربات ۳",team:1}
 ];
 duration=999;startWorld();
}
function startOnline(){
 if(!isHost||players.length!==getCapacity())return;
 mode=getCapacity();duration=Number($("duration").value);
 startWorld();
 broadcast({type:"start",game});
}
function startWorld(){
 game={remaining:duration*60,over:false,snakes:players.map(createSnake),foods:[]};
 for(let i=0;i<30;i++)game.foods.push(randomFood());
 openGame();runGame();
}
function openGame(){
 hide("lobby");hide("roomPanel");show("gamePanel");
 hide("backButton");hide("homeButton");$("message").textContent="";
}
function rotate(angle){
 if(!game||game.over)return;
 if(isHost){
  const s=game.snakes.find(x=>x.id===myId);
  if(s)s.angle=angle;
 }else if(conn&&conn.open)conn.send({type:"angle",angle});
}
function wrap(n,max){return (n%max+max)%max}

// جوی‌استیک چرخشی ۳۶۰ درجه
const stick=$("joystick"),knob=$("knob");
let dragging=false;
function joystick(e){
 const r=stick.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=42,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.left=(44+dx)+"px";
 knob.style.top=(44+dy)+"px";
 if(len>8)rotate(Math.atan2(dy,dx));
}
stick.addEventListener("pointerdown",e=>{
 dragging=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{if(dragging)joystick(e)});
stick.addEventListener("pointerup",()=>{dragging=false;knob.style.left="44px";knob.style.top="44px"});
stick.addEventListener("pointercancel",()=>{dragging=false;knob.style.left="44px";knob.style.top="44px"});

function botMove(s){
 if(!game.foods.length)return;
 const h={x:s.x,y:s.y};
 let target=game.foods.reduce((best,f)=>distance(h,f)<distance(h,best)?f:best,game.foods[0]);
 let dx=target.x-h.x,dy=target.y-h.y;
 if(dx>WIDTH/2)dx-=WIDTH;if(dx< -WIDTH/2)dx+=WIDTH;
 if(dy>HEIGHT/2)dy-=HEIGHT;if(dy< -HEIGHT/2)dy+=HEIGHT;
 const desired=Math.atan2(dy,dx);
 let diff=Math.atan2(Math.sin(desired-s.angle),Math.cos(desired-s.angle));
 s.angle+=Math.max(-0.09,Math.min(0.09,diff));
}
function runGame(){
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 moveTimer=setInterval(()=>{
  if(!game||game.over)return;
  game.snakes.forEach(s=>{
   if(!s.alive)return;
   if(s.bot)botMove(s);
   s.x=wrap(s.x+Math.cos(s.angle)*s.speed,WIDTH);
   s.y=wrap(s.y+Math.sin(s.angle)*s.speed,HEIGHT);
   s.body.unshift({x:s.x,y:s.y});
   const wanted=s.length*5;
   while(s.body.length>wanted)s.body.pop();
   s.score++;
   const fi=game.foods.findIndex(f=>distance(f,{x:s.x,y:s.y})<13);
   if(fi>=0){s.length+=5;s.score+=10;game.foods.splice(fi,1);game.foods.push(randomFood())}
  });
  // برخورد با بدن؛ عبور از لبه‌ها آزاد است
  game.snakes.forEach(s=>{
   if(!s.alive)return;
   for(let i=12;i<s.body.length;i++){
    if(distance(s.body[0],s.body[i])<7){s.alive=false;break}
   }
   if(!s.alive)return;
   for(const other of game.snakes){
    if(other.id===s.id)continue;
    for(let i=8;i<other.body.length;i++){
     if(distance(s.body[0],other.body[i])<8){s.alive=false;break}
    }
    if(!s.alive)break;
   }
  });
  if(solo){
   const me=game.snakes.find(s=>s.id==="solo");
   const bots=game.snakes.filter(s=>s.bot&&s.alive);
   if(!me.alive)finish("مار تو باخت! 🤖");
   else if(!bots.length)finish("تو برنده شدی! 🏆");
  }else{
   const a=game.snakes.some(s=>s.team===0&&s.alive);
   const b=game.snakes.some(s=>s.team===1&&s.alive);
   if(!a||!b)finish(a?"تیم اول برنده شد!":"تیم دوم برنده شد!");
  }
  draw();
 },35);
 secondTimer=setInterval(()=>{
  if(!game||game.over)return;
  game.remaining--;
  if(game.remaining<=0){
   const a=game.snakes.filter(s=>s.team===0).reduce((n,s)=>n+s.score,0);
   const b=game.snakes.filter(s=>s.team===1).reduce((n,s)=>n+s.score,0);
   finish(a===b?"مساوی!":a>b?"تیم اول برنده شد!":"تیم دوم برنده شد!");
  }
 },1000);
 if(!solo){
  sendTimer=setInterval(()=>{if(game&&!game.over)broadcast({type:"state",game})},120);
 }
}
function finish(message){
 if(!game||game.over)return;
 game.over=true;
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 $("message").textContent=message;
 show("homeButton");if(!solo)show("backButton");
 if(!solo)broadcast({type:"end",game,message});
 draw();
}
function draw(){
 if(!game)return;
 ctx.fillStyle="#081522";ctx.fillRect(0,0,WIDTH,HEIGHT);
 // شبکه زمین
 ctx.strokeStyle="#19354a";ctx.lineWidth=1;
 for(let x=0;x<=WIDTH;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,HEIGHT);ctx.stroke()}
 for(let y=0;y<=HEIGHT;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WIDTH,y);ctx.stroke()}
 // غذا در تمام نقاط نقشه
 game.foods.forEach(f=>{
  ctx.fillStyle="#ffdc51";ctx.shadowBlur=12;ctx.shadowColor="#ffdc51";
  ctx.beginPath();ctx.arc(f.x,f.y,6,0,TAU);ctx.fill();
 });
 ctx.shadowBlur=0;
 game.snakes.forEach(s=>{
  ctx.globalAlpha=s.alive?1:.25;
  ctx.strokeStyle=s.team===0?"#27e3bd":"#fa557b";
  ctx.lineWidth=12;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  s.body.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  });
  ctx.stroke();
  if(s.alive){
   ctx.fillStyle="white";
   ctx.beginPath();ctx.arc(s.x+Math.cos(s.angle)*5,s.y+Math.sin(s.angle)*5,2,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
 });
 ctx.shadowBlur=0;
 $("scores").textContent=game.snakes.map(s=>s.name+": "+s.score).join(" | ");
 const t=Math.max(0,game.remaining);
 $("timer").textContent="زمان: "+String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function backRoom(){
 if(!isHost)return;
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 game=null;hide("gamePanel");show("roomPanel");renderRoom();
}
function leaveRoom(){
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 if(peer)peer.destroy();
 peer=null;conn=null;connections=[];players=[];game=null;solo=false;
 openLobby();
}
function copyInvite(){
 const link=location.origin+location.pathname+"?room="+roomCode;
 if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>alert("لینک دعوت کپی شد"));
 else prompt("لینک دعوت",link);
}
</script>
</body>
</html>
