
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{background:#101820;color:white;text-align:center;font-family:Arial}
button,input{padding:12px;margin:5px;border:0;border-radius:8px}
button{background:#16c784;color:#07120d;font-weight:bold}
canvas{background:#172b25;border:2px solid #16c784;max-width:95vw}
</style>
</head>
<body>
<h2>🐍 Snake Online</h2>
<button onclick="host()">ساخت اتاق</button>
<br>
<input id="room" placeholder="کد اتاق دوستت">
<button onclick="join()">ورود به اتاق</button>
<p id="status">منتظر اتصال...</p>
<canvas id="game" width="400" height="400"></canvas>
<p>حرکت: کلیدهای جهت‌دار یا WASD</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const status=document.getElementById("status");
const size=20;
let peer,conn,hostMode=false,started=false;
let snakes=[],food={x:10,y:10},dirs=[[1,0],[-1,0]],score=[0,0];
let myDir=[1,0],guestDir=[-1,0],timer;

function say(t){status.textContent=t}
function host(){
 if(peer)return;
 hostMode=true;
 peer=new Peer();
 peer.on("open",id=>{
  document.getElementById("room").value=id;
  say("کد اتاق: "+id+" | این کد را برای دوستت بفرست");
 });
 peer.on("connection",connection=>{
  conn=connection;
  conn.on("open",()=>{
   say("دوستت وصل شد! بازی شروع شد");
   start();
  });
  conn.on("data",d=>{
   if(d.type==="dir")guestDir=d.dir;
  });
 });
 peer.on("error",e=>say("خطا در اتصال: "+e.type));
}
function join(){
 const id=document.getElementById("room").value.trim();
 if(!id)return say("کد اتاق را وارد کن");
 peer=new Peer();
 peer.on("open",()=>{
  conn=peer.connect(id);
  conn.on("open",()=>{
   say("وصل شدی! بازی شروع شد");
   start();
  });
  conn.on("data",d=>{if(d.type==="state")draw(d)});
 });
 peer.on("error",e=>say("اتصال ناموفق: "+e.type));
}
function start(){
 if(started)return;
 started=true;
 snakes=[
  [{x:4,y:10},{x:3,y:10},{x:2,y:10}],
  [{x:15,y:10},{x:16,y:10},{x:17,y:10}]
 ];
 food={x:10,y:10};score=[0,0];
 if(hostMode)timer=setInterval(step,140);
}
function step(){
 dirs=[myDir,guestDir];
 for(let i=0;i<2;i++){
  const head={x:snakes[i][0].x+dirs[i][0],y:snakes[i][0].y+dirs[i][1]};
  if(head.x<0||head.x>=20||head.y<0||head.y>=20||
     snakes[i].some(p=>p.x===head.x&&p.y===head.y)){
   clearInterval(timer);started=false;
   say("بازیکن "+(i+1)+" باخت! برای بازی دوباره صفحه را تازه کن.");
   return;
  }
  snakes[i].unshift(head);
  if(head.x===food.x&&head.y===food.y){
   score[i]++;
   food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
  }else snakes[i].pop();
 }
 const data={type:"state",snakes,food,score};
 draw(data);
 if(conn&&conn.open)conn.send(data);
}
function draw(d){
 ctx.clearRect(0,0,400,400);
 ctx.fillStyle="#ffcc33";
 ctx.fillRect(d.food.x*20,d.food.y*20,18,18);
 const colors=["#16c784","#39a9ff"];
 d.snakes.forEach((s,i)=>{
  ctx.fillStyle=colors[i];
  s.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));
 });
 status.textContent="بازیکن ۱: "+d.score[0]+" | بازیکن ۲: "+d.score[1];
}
document.addEventListener("keydown",e=>{
 const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
 const d=keys[e.key];
 if(!d)return;
 e.preventDefault();
 if(hostMode)myDir=d;
 else guestDir=d;
 if(conn&&conn.open)conn.send({type:"dir",dir:d});
});
</script>
</body>
</html>
