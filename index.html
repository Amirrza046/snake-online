
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font-family:Tahoma,Arial;text-align:center}
header{padding:18px;background:#19243a;border-bottom:2px solid #35c98b}
h1{margin:0;color:#55e6a5}
main{max-width:650px;margin:auto;padding:12px}
.panel{background:#19243a;border:1px solid #34445f;border-radius:15px;padding:14px;margin:12px 0}
button,input,select{font:inherit;border:0;border-radius:9px;padding:12px;margin:5px}
button{background:#35c98b;color:#071b17;font-weight:bold}
.secondary{background:#34445f;color:white}
.danger{background:#df5969;color:white}
input,select{background:#0e1728;color:white;border:1px solid #44536b}
input{max-width:280px;width:85%}
.hidden{display:none!important}
.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}
#game{width:min(94vw,520px);height:min(94vw,520px);background:#080e18;border:3px solid #3c5270;border-radius:12px;touch-action:none}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.player{background:#101a2b;padding:10px;border-radius:10px}
.controls{display:grid;grid-template-columns:repeat(3,65px);gap:7px;justify-content:center;margin:12px}
.controls button{height:55px;font-size:22px;margin:0}
#status{color:#ffd36b;min-height:25px}
#result{color:#55e6a5;font-size:20px}
#scoreboard{line-height:2;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🐍 SNAKE ARENA</h1>
<small>PLAY • COMPETE • SURVIVE</small>
</header>
<main>

<section id="profile" class="panel">
<h3>ساخت پروفایل</h3>
<input id="nameInput" maxlength="16" placeholder="اسم بازیکن">
<p>آواتار خودت را انتخاب کن</p>
<select id="avatarInput">
<option>🐍</option><option>😎</option><option>🔥</option>
<option>🐲</option><option>👑</option><option>⚡</option>
<option>🦊</option><option>🐼</option>
</select>
<p><button onclick="saveProfile()">ورود به بازی</button></p>
</section>

<section id="home" class="panel hidden">
<h3>خوش آمدی <span id="welcome"></span></h3>
<p>امتیاز کل: <b id="totalPoints">0</b> 🏆</p>
<p>بهترین رکورد: <b id="bestPoints">0</b></p>
<button onclick="startSolo()">🎮 بازی با ربات</button>
<button onclick="createRoom()">➕ ساخت اتاق آنلاین</button>
<div class="row">
<input id="joinCode" placeholder="کد اتاق">
<button onclick="joinRoom()">ورود به اتاق</button>
</div>
</section>

<section id="lobby" class="panel hidden">
<h3>🏠 اتاق بازی</h3>
<p>کد اتاق: <b id="roomCode"></b></p>
<button class="secondary" onclick="copyInvite()">کپی لینک دعوت 🔗</button>
<p id="roomStatus"></p>
<div id="players" class="players"></div>
<div id="hostSettings">
<p>حالت مسابقه</p>
<select id="mode">
<option value="1v1">۱ به ۱</option>
<option value="1v2">۱ به ۲</option>
<option value="2v2">۲ به ۲</option>
</select>
<p>مدت مسابقه</p>
<select id="duration">
<option value="120">۲ دقیقه</option>
<option value="180">۳ دقیقه</option>
<option value="300">۵ دقیقه</option>
</select>
<button onclick="startOnline()">شروع مسابقه 🚀</button>
</div>
<button class="danger" onclick="leaveRoom()">خروج از اتاق</button>
</section>

<section id="gamePanel" class="panel hidden">
<div class="row">
<span>امتیاز من: <b id="myScore">0</b></span>
<span>زمان: <b id="timer">00:00</b></span>
</div>
<canvas id="game" width="520" height="520"></canvas>
<div id="scoreboard"></div>
<p id="result"></p>
<div class="controls">
<span></span><button onclick="move('up')">⬆️</button><span></span>
<button onclick="move('left')">⬅️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('right')">➡️</button>
</div>
<button onclick="restartGame()">🔄 شروع مجدد</button>
<button class="secondary" onclick="backToLobby()">بازگشت به اتاق</button>
</section>
<p id="status"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const N=26,CELL=20;
let profile=null,total=0,best=0;
let peer=null,host=false,roomId="",myId="";
let connections=new Map(),players=[];
let game=null,tick=null,clock=null;
let secondsLeft=120,mode="1v1",duration=120;
let inviteRoom="";

function status(s){$("status").textContent=s}
function show(id){
["profile","home","lobby","gamePanel"].forEach(x=>$(x).classList.add("hidden"));
$(id).classList.remove("hidden");
}
function loadProfile(){
try{profile=JSON.parse(localStorage.getItem("sa_profile"))}catch(e){}
total=Number(localStorage.getItem("sa_points")||0);
best=Number(localStorage.getItem("sa_best")||0);
if(profile){
$("welcome").textContent=profile.avatar+" "+profile.name;
$("totalPoints").textContent=total;
$("bestPoints").textContent=best;
show("home");
}else show("profile");
}
function saveProfile(){
let name=$("nameInput").value.trim();
if(!name)return alert("اسمت را وارد کن");
profile={name,avatar:$("avatarInput").value};
localStorage.setItem("sa_profile",JSON.stringify(profile));
loadProfile();
if(inviteRoom){$("joinCode").value=inviteRoom;joinRoom()}
}
function addPoints(n){
total+=n;
localStorage.setItem("sa_points",total);
$("totalPoints").textContent=total;
}
function updateBest(n){
if(n>best){
best=n;
localStorage.setItem("sa_best",best);
$("bestPoints").textContent=best;
}
}
function code(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let s="";
for(let i=0;i<7;i++)s+=chars[Math.floor(Math.random()*chars.length)];
return s;
}
function food(){return{x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
function makePlayer(id,name,avatar,team,x,y,bot=false){
return{id,name,avatar,team,x,y,dir:"right",
body:[{x,y},{x:x-1,y},{x:x-2,y}],
score:0,alive:true,bot};
}
function capacity(m){return m==="1v1"?2:m==="1v2"?3:4}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderLobby(){
$("players").innerHTML=players.map(p=>
`<div class="player">${p.avatar} ${escapeHTML(p.name)}<br>تیم ${p.team}</div>`
).join("");
$("roomStatus").textContent=players.length+" نفر در اتاق هستند";
}
function createRoom(){
if(typeof Peer==="undefined")return status("سرویس اتصال بارگذاری نشد");
host=true;players=[];
let c=code();roomId="sa-"+c.toLowerCase();myId="host-"+c;
peer=new Peer(roomId);
status("در حال ساخت اتاق...");
peer.on("open",()=>{
players=[makePlayer(myId,profile.name,profile.avatar,"A",5,13)];
$("roomCode").textContent=c;
$("hostSettings").classList.remove("hidden");
show("lobby");renderLobby();
status("اتاق ساخته شد.");
});
peer.on("connection",conn=>{
connections.set(conn.peer,conn);
conn.on("data",d=>hostMessage(conn,d));
conn.on("close",()=>removeGuest(conn.peer));
});
peer.on("error",e=>status("خطای اتصال: "+e.type));
}
function broadcast(d){
connections.forEach(c=>{if(c.open)c.send(d)});
}
function hostMessage(c,d){
if(d.type==="join"){
if(players.length>=4){c.send({type:"full"});return}
if(players.some(p=>p.id===c.peer))return;
players.push(makePlayer(c.peer,d.name,d.avatar,"B",10+players.length*2,10));
c.send({type:"welcome",id:c.peer,players,room:roomId});
broadcast({type:"lobby",players});
renderLobby();
}
if(d.type==="dir"){
let p=players.find(x=>x.id===c.peer);
if(p&&validDir(p.dir,d.dir))p.dir=d.dir;
}
if(d.type==="back"&&host)backToLobby();
if(d.type==="restart"&&host&&!game?.running)startOnline();
}
function removeGuest(id){
connections.delete(id);
players=players.filter(p=>p.id!==id);
if(host){broadcast({type:"lobby",players});renderLobby()}
}
function copyInvite(){
let link=location.origin+location.pathname+"?room="+roomId;
if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>status("لینک کپی شد")).catch(()=>prompt("لینک دعوت",link));
else prompt("لینک دعوت",link);
}
function joinRoom(){
if(!profile)return show("profile");
let c=$("joinCode").value.trim().toLowerCase();
if(!c)return status("کد اتاق را وارد کن");
if(!c.startsWith("sa-"))c="sa-"+c;
roomId=c;host=false;
peer=new Peer();
status("در حال اتصال...");
peer.on("open",()=>{
let conn=peer.connect(roomId,{reliable:true});
connections.set(roomId,conn);
conn.on("open",()=>conn.send({type:"join",name:profile.name,avatar:profile.avatar}));
conn.on("data",guestMessage);
conn.on("error",()=>status("خطای اتصال"));
});
peer.on("error",e=>status("اتصال ناموفق: "+e.type));
}
function guestMessage(d){
if(d.type==="full"){status("اتاق پر است.");return}
if(d.type==="welcome"){
myId=d.id;players=d.players;
$("roomCode").textContent=roomId.slice(3).toUpperCase();
$("hostSettings").classList.add("hidden");
show("lobby");renderLobby();status("وارد اتاق شدی.");
}
if(d.type==="lobby"){players=d.players;renderLobby()}
if(d.type==="start"){
players=d.players;game=d.game;secondsLeft=d.seconds;
show("gamePanel");draw();renderScores();
}
if(d.type==="snapshot"){
game=d.game;players=game.players;draw();renderScores();
}
if(d.type==="finish"){
players=d.players;game=d.game;showResult(d.winners);
}
if(d.type==="back"){players=d.players;show("lobby");renderLobby()}
if(d.type==="closed"){show("home");status("اتاق بسته شد")}
}
function startSolo(){
host=false;myId="solo";
players=[
makePlayer("solo",profile.name,profile.avatar,"A",5,13),
makePlayer("bot","ربات","🤖","B",19,13,true)
];
duration=120;
startGame();
}
function startOnline(){
if(!host)return;
mode=$("mode").value;duration=Number($("duration").value);
if(players.length!==capacity(mode))
return status("برای این حالت باید "+capacity(mode)+" بازیکن حاضر باشند.");
players.forEach((p,i)=>{
p.team=mode==="2v2"?(i%2?"B":"A"):(i===0?"A":"B");
let x=4+(i*5)%18,y=5+(i*7)%17;
p.body=[{x,y},{x:x-1,y},{x:x-2,y}];
p.x=x;p.y=y;p.dir="right";p.alive=true;p.score=0;
});
startGame();
broadcast({type:"start",players,game,seconds:secondsLeft});
}
function startGame(){
clearInterval(tick);clearInterval(clock);
game={players,food:food(),running:true};
secondsLeft=duration;
$("result").textContent="";
show("gamePanel");draw();renderScores();
if(host||myId==="solo"){
tick=setInterval(step,160);
clock=setInterval(()=>{
if(!game?.running)return;
secondsLeft--;
players.forEach(p=>{
if(p.alive){
p.score+=1;
if(p.id===myId){addPoints(1);updateBest(p.score)}
}
});
if(secondsLeft<=0)finishGame();
draw();renderScores();
},1000);
}
}
function validDir(old,next){
return !(old==="up"&&next==="down"||old==="down"&&next==="up"||
old==="left"&&next==="right"||old==="right"&&next==="left");
}
function move(d){
let p=players.find(x=>x.id===myId);
if(!p||!p.alive)return;
if(!validDir(p.dir,d))return;
if(host||myId==="solo")p.dir=d;
else connections.get(roomId)?.send({type:"dir",dir:d});
}
function botMove(p){
let f=game.food;
if(Math.abs(f.x-p.x)>Math.abs(f.y-p.y)){
let d=f.x>p.x?"right":"left";
if(validDir(p.dir,d))p.dir=d;
}else{
let d=f.y>p.y?"down":"up";
if(validDir(p.dir,d))p.dir=d;
}
}
function step(){
if(!game?.running)return;
players.forEach(p=>{
if(!p.alive)return;
if(p.bot)botMove(p);
let head={...p.body[0]};
if(p.dir==="up")head.y--;
if(p.dir==="down")head.y++;
if(p.dir==="left")head.x--;
if(p.dir==="right")head.x++;
p.body.unshift(head);
let ate=head.x===game.food.x&&head.y===game.food.y;
if(ate){
p.score+=10;
if(p.id===myId){addPoints(10);updateBest(p.score)}
game.food=food();
}else p.body.pop();
p.x=head.x;p.y=head.y;
});
players.forEach(p=>{
if(!p.alive)return;
let h=p.body[0];
let hit=h.x<0||h.y<0||h.x>=N||h.y>=N;
if(p.body.slice(1).some(b=>b.x===h.x&&b.y===h.y))hit=true;
players.forEach(other=>{
if(other!==p&&other.alive&&other.body.some(b=>b.x===h.x&&b.y===h.y))hit=true;
});
if(hit)p.alive=false;
});
let alive=players.filter(p=>p.alive);
if(alive.length<=1)finishGame(alive);
draw();renderScores();
if(host)broadcast({type:"snapshot",game});
}
function finishGame(alive=players.filter(p=>p.alive)){
if(!game?.running)return;
game.running=false;
clearInterval(tick);clearInterval(clock);
let winners=alive.map(p=>p.name);
if(host)broadcast({type:"finish",players,winners});
showResult(winners);
}
function showResult(winners){
$("result").textContent=winners.length?"زنده ماندند: "+winners.join("، "):"همه حذف شدند!";
draw();renderScores();
}
function renderScores(){
let me=players.find(p=>p.id===myId);
$("myScore").textContent=me?me.score:0;
$("timer").textContent=Math.floor(secondsLeft/60)+":"+String(secondsLeft%60).padStart(2,"0");
$("scoreboard").innerHTML=players.map(p=>
`${p.avatar} ${escapeHTML(p.name)}: <b>${p.score}</b> امتیاز ${p.alive?"🟢":"❌"}`
).join("<br>");
}
function draw(){
ctx.clearRect(0,0,520,520);
ctx.strokeStyle="#17243a";
for(let i=0;i<=N;i++){
ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,520);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(520,i*CELL);ctx.stroke();
}
if(!game)return;
ctx.fillStyle="#ffcc4d";
ctx.beginPath();
ctx.arc((game.food.x+.5)*CELL,(game.food.y+.5)*CELL,8,0,Math.PI*2);
ctx.fill();
players.forEach(p=>{
if(!p.alive)return;
ctx.fillStyle=p.team==="A"?"#35d99b":"#e46a78";
p.body.forEach(b=>ctx.fillRect(b.x*CELL+1,b.y*CELL+1,CELL-2,CELL-2));
});
}
function restartGame(){
if(myId==="solo"){startSolo();return}
if(host){startOnline();return}
connections.get(roomId)?.send({type:"restart"});
status("درخواست شروع مجدد فرستاده شد.");
}
function backToLobby(){
if(myId==="solo"){
clearInterval(tick);clearInterval(clock);show("home");return;
}
if(host){
clearInterval(tick);clearInterval(clock);
game=null;
broadcast({type:"back",players});
show("lobby");renderLobby();
}else connections.get(roomId)?.send({type:"back"});
}
function leaveRoom(){
clearInterval(tick);clearInterval(clock);
if(host)broadcast({type:"closed"});
connections.forEach(c=>c.close());
connections.clear();
if(peer)peer.destroy();
peer=null;game=null;players=[];show("home");
}
let touchX=null,touchY=null;
canvas.addEventListener("touchstart",e=>{
e.preventDefault();
touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
},{passive:false});
canvas.addEventListener("touchmove",e=>{
e.preventDefault();
if(touchX===null)return;
let t=e.touches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;
if(Math.max(Math.abs(dx),Math.abs(dy))>22){
move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
touchX=t.clientX;touchY=t.clientY;
}
},{passive:false});
canvas.addEventListener("touchend",()=>{touchX=null;touchY=null});
document.addEventListener("keydown",e=>{
let map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};
if(map[e.key])move(map[e.key]);
});
const params=new URLSearchParams(location.search);
inviteRoom=params.get("room")||"";
if(inviteRoom.startsWith("sa-"))$("joinCode").value=inviteRoom;
loadProfile();
</script>
</body>
</html>
