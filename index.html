
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071321;color:white;font-family:Tahoma;text-align:center}
header{padding:15px;color:#40f5d0;font-size:27px;font-weight:bold}
.panel{width:94%;max-width:560px;margin:12px auto;padding:15px;background:#12263a;border:1px solid #28536a;border-radius:18px}
h3{color:#40f5d0}
input,select,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:10px;background:#203b52;color:white;font-size:15px}
button{background:#087f78;font-weight:bold}
.hidden{display:none!important}
#gameCanvas{width:100%;height:auto;background:#081522;border:2px solid #40e8c7;border-radius:12px;touch-action:none}
#joystick{width:140px;height:140px;border-radius:50%;background:#19384d;border:2px solid #40f5d0;position:relative;margin:16px auto;touch-action:none}
#knob{width:48px;height:48px;border-radius:50%;background:#40f5d0;position:absolute;left:44px;top:44px;pointer-events:none}
.small{font-size:12px;color:#b4c9d9;line-height:1.8}
#roomCode{direction:ltr;color:#40f5d0}
</style>
</head>
<body>
<header>🐍 SNAKE ARENA</header>

<section id="profile" class="panel hidden">
<h3>پروفایل بازیکن</h3>
<input id="name" maxlength="16" placeholder="نام بازیکن">
<select id="gender"><option value="">جنسیت</option><option>پسر</option><option>دختر</option><option>بدون اعلام</option></select>
<button onclick="saveProfile()">ذخیره</button>
</section>

<section id="lobby" class="panel hidden">
<h3>سلام <span id="welcome"></span> 👋</h3>
<button onclick="startSolo()">🎮 بازی با ۴۹ ربات</button>
<button onclick="createRoom()">ساخت اتاق آنلاین</button>
<input id="roomInput" placeholder="کد اتاق">
<button onclick="joinRoom()">پیوستن به اتاق</button>
</section>

<section id="roomPanel" class="panel hidden">
<h3>🏟️ اتاق آنلاین</h3>
<div>کد اتاق:</div><div id="roomCode"></div>
<button onclick="copyInvite()">کپی لینک دعوت</button>
<h3>بازیکنان</h3><div id="players"></div>
<div id="status">در انتظار بازیکنان...</div>
<button id="startButton" onclick="startOnline()">شروع مسابقه</button>
<button onclick="leaveRoom()">خروج</button>
</section>

<section id="gamePanel" class="panel hidden">
<h3>🐍 Snake Arena</h3>
<div id="timer"></div>
<div id="scores"></div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<h3 id="message"></h3>
<div class="small">جوی‌استیک را به هر زاویه‌ای بکش.</div>
<div id="joystick"><div id="knob"></div></div>
<button id="backButton" class="hidden" onclick="backRoom()">بازگشت به اتاق</button>
<button id="homeButton" class="hidden" onclick="leaveRoom()">بازگشت به منو</button>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$("gameCanvas"),ctx=canvas.getContext("2d");
const VIEW_W=600,VIEW_H=400;
const WORLD=5000,FOOD_COUNT=250;
const TAU=Math.PI*2;
let profile=JSON.parse(localStorage.getItem("snakeProfile")||"null");
let peer=null,conn=null,connections=[];
let isHost=false,solo=false,myId="",roomCode="";
let players=[],game=null;
let moveTimer=null,secondTimer=null,sendTimer=null;
let duration=5;

function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function saveProfile(){
 const name=$("name").value.trim(),gender=$("gender").value;
 if(!name||!gender){alert("نام و جنسیت را وارد کن");return}
 profile={name,gender};localStorage.setItem("snakeProfile",JSON.stringify(profile));openLobby();
}
function openLobby(){
 hide("profile");hide("roomPanel");hide("gamePanel");show("lobby");$("welcome").textContent=profile.name;
}
if(profile)openLobby();else show("profile");

function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const a=crypto.getRandomValues(new Uint8Array(10));
 return Array.from(a,v=>chars[v%chars.length]).join("");
}
function createRoom(){
 if(!window.Peer){alert("اینترنت را بررسی کن");return}
 if(peer)peer.destroy();
 isHost=true;solo=false;players=[];connections=[];
 roomCode=makeCode();myId="snake-"+roomCode.toLowerCase();
 hide("lobby");show("roomPanel");$("roomCode").textContent=roomCode;
 $("status").textContent="در حال ساخت اتاق...";
 peer=new Peer(myId);
 peer.on("open",()=>{
  players=[{id:myId,name:profile.name}];renderRoom();
 });
 peer.on("connection",c=>{
  c.on("open",()=>{
   connections.push(c);
   c.on("data",d=>hostReceive(c,d));
   c.on("close",()=>{
    players=players.filter(p=>p.id!==c.peer);
    connections=connections.filter(x=>x!==c);renderRoom();
   });
  });
 });
 peer.on("error",e=>$("status").textContent="خطا: "+e.type);
}
function joinRoom(){
 const code=($("roomInput").value||new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
 if(!code){alert("کد اتاق را وارد کن");return}
 if(peer)peer.destroy();
 roomCode=code;isHost=false;
 hide("lobby");show("roomPanel");$("roomCode").textContent=code;
 $("status").textContent="در حال اتصال...";
 peer=new Peer();
 peer.on("open",id=>{
  myId=id;conn=peer.connect("snake-"+code.toLowerCase(),{reliable:true});
  conn.on("open",()=>conn.send({type:"join",name:profile.name}));
  conn.on("data",guestReceive);
 });
 peer.on("error",e=>$("status").textContent="اتصال برقرار نشد: "+e.type);
}
function hostReceive(c,d){
 if(!d)return;
 if(d.type==="join"){
  if(players.length>=50){c.send({type:"reject"});return}
  if(players.some(p=>p.id===c.peer))return;
  players.push({id:c.peer,name:String(d.name).slice(0,16)});
  renderRoom();
 }
 if(d.type==="angle"&&game&&!game.over){
  const s=game.snakes.find(x=>x.id===c.peer);if(s)s.angle=d.angle;
 }
}
function guestReceive(d){
 if(!d)return;
 if(d.type==="reject"){alert("اتاق پر است");return}
 if(d.type==="room"){players=d.players;renderPlayers()}
 if(d.type==="start"){game=d.game;openGame();draw()}
 if(d.type==="state"){game=d.game;draw()}
 if(d.type==="end"){game=d.game;draw();$("message").textContent=d.message;show("backButton")}
}
function broadcast(d){connections.forEach(c=>{if(c.open)c.send(d)})}
function renderPlayers(){
 $("players").innerHTML=players.map(p=>esc(p.name)).join("<br>")+"<br>بازیکنان: "+players.length+"/50";
}
function renderRoom(){
 renderPlayers();
 if(isHost){
  broadcast({type:"room",players});
  $("status").textContent="بازیکنان: "+players.length+"/50";
 }
}
function wrap(n,max){return (n%max+max)%max}
function torusDelta(a,b,max){
 let d=a-b;if(d>max/2)d-=max;if(d< -max/2)d+=max;return d;
}
function dist(a,b){
 return Math.hypot(torusDelta(a.x,b.x,WORLD),torusDelta(a.y,b.y,WORLD));
}
function randomPoint(){return {x:Math.random()*WORLD,y:Math.random()*WORLD}}
function makeSnake(p,i){
 const angle=Math.random()*TAU;
 const pos=randomPoint();
 const body=[];
 for(let n=0;n<20;n++){
  body.push({x:wrap(pos.x-Math.cos(angle)*n*5,WORLD),y:wrap(pos.y-Math.sin(angle)*n*5,WORLD)});
 }
 return {id:p.id,name:p.name,angle,x:pos.x,y:pos.y,body,
 alive:true,score:0,length:20,speed:2.4,bot:p.id.startsWith("bot")};
}
function startSolo(){
 if(peer)peer.destroy();peer=null;conn=null;connections=[];
 solo=true;isHost=true;myId="solo";
 players=[{id:"solo",name:profile.name}];
 for(let i=1;i<=49;i++)players.push({id:"bot"+i,name:"ربات "+i});
 duration=999;startWorld();
}
function startOnline(){
 if(!isHost||players.length<2)return;
 solo=false;duration=5;startWorld();
 broadcast({type:"start",game});
}
function startWorld(){
 game={remaining:duration*60,over:false,snakes:players.map(makeSnake),foods:[]};
 for(let i=0;i<FOOD_COUNT;i++)game.foods.push(randomPoint());
 openGame();runGame();
}
function openGame(){
 hide("lobby");hide("roomPanel");show("gamePanel");
 hide("backButton");hide("homeButton");$("message").textContent="";
}
function rotate(angle){
 if(!game||game.over)return;
 if(isHost){
  const s=game.snakes.find(x=>x.id===myId);if(s)s.angle=angle;
 }else if(conn&&conn.open)conn.send({type:"angle",angle});
}
const stick=$("joystick"),knob=$("knob");let dragging=false;
function joystick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=42;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.left=(44+dx)+"px";knob.style.top=(44+dy)+"px";
 if(len>7)rotate(Math.atan2(dy,dx));
}
stick.addEventListener("pointerdown",e=>{dragging=true;stick.setPointerCapture(e.pointerId);joystick(e)});
stick.addEventListener("pointermove",e=>{if(dragging)joystick(e)});
function resetStick(){dragging=false;knob.style.left="44px";knob.style.top="44px"}
stick.addEventListener("pointerup",resetStick);stick.addEventListener("pointercancel",resetStick);

function botMove(s){
 if(!game.foods.length)return;
 let target=game.foods[0],best=Infinity;
 for(let i=0;i<game.foods.length;i+=4){
  const f=game.foods[i],d=dist(s,f);
  if(d<best){best=d;target=f}
 }
 const dx=torusDelta(target.x,s.x,WORLD),dy=torusDelta(target.y,s.y,WORLD);
 const desired=Math.atan2(dy,dx);
 let diff=Math.atan2(Math.sin(desired-s.angle),Math.cos(desired-s.angle));
 s.angle+=Math.max(-0.07,Math.min(0.07,diff));
}
function respawnFood(){game.foods.push(randomPoint())}
function runGame(){
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 moveTimer=setInterval(()=>{
  if(!game||game.over)return;
  game.snakes.forEach(s=>{
   if(!s.alive)return;
   if(s.bot)botMove(s);
   s.x=wrap(s.x+Math.cos(s.angle)*s.speed,WORLD);
   s.y=wrap(s.y+Math.sin(s.angle)*s.speed,WORLD);
   s.body.unshift({x:s.x,y:s.y});
   while(s.body.length>s.length*5)s.body.pop();
   s.score++;
   const fi=game.foods.findIndex(f=>dist(f,s)<13);
   if(fi>=0){s.length+=4;s.score+=10;game.foods.splice(fi,1);respawnFood()}
  });
  // برخورد و حذف کامل مار مرده
  const dead=new Set();
  game.snakes.forEach(s=>{
   if(!s.alive)return;
   for(let i=12;i<s.body.length;i++){
    if(dist(s.body[0],s.body[i])<8){dead.add(s.id);break}
   }
   if(dead.has(s.id))return;
   for(const other of game.snakes){
    if(other.id===s.id||!other.alive)continue;
    for(let i=8;i<other.body.length;i++){
     if(dist(s.body[0],other.body[i])<8){dead.add(s.id);break}
    }
    if(dead.has(s.id))break;
   }
  });
  if(dead.size){
   game.snakes=game.snakes.filter(s=>!dead.has(s.id));
  }
  if(solo){
   if(!game.snakes.some(s=>s.id==="solo"))finish("تو باختی!");
   else if(!game.snakes.some(s=>s.bot))finish("تو برنده شدی! 🏆");
  }else if(game.snakes.length<=1)finish("مسابقه تمام شد!");
  draw();
 },35);
 secondTimer=setInterval(()=>{
  if(!game||game.over)return;
  game.remaining--;
  if(game.remaining<=0)finish("زمان مسابقه تمام شد!");
 },1000);
 if(!solo)sendTimer=setInterval(()=>{if(game&&!game.over)broadcast({type:"state",game})},150);
}
function finish(message){
 if(!game||game.over)return;
 game.over=true;
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 $("message").textContent=message;show("homeButton");
 if(!solo)show("backButton");
 if(!solo)broadcast({type:"end",game,message});
 draw();
}
function draw(){
 if(!game)return;
 const me=game.snakes.find(s=>s.id===myId)||game.snakes[0];
 if(!me)return;
 const camX=me.x,camY=me.y;
 ctx.fillStyle="#081522";ctx.fillRect(0,0,VIEW_W,VIEW_H);
 // دوربین دنبال مار خودت حرکت می‌کند
 const sx=x=>VIEW_W/2+torusDelta(x,camX,WORLD);
 const sy=y=>VIEW_H/2+torusDelta(y,camY,WORLD);
 // شبکه در محدوده دید
 ctx.strokeStyle="#19354a";ctx.lineWidth=1;
 const left=wrap(camX-WORLD/2,WORLD),top=wrap(camY-WORLD/2,WORLD);
 for(let i=-VIEW_W;i<=VIEW_W;i+=40){
  const x=VIEW_W/2+i;
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,VIEW_H);ctx.stroke();
 }
 for(let i=-VIEW_H;i<=VIEW_H;i+=40){
  const y=VIEW_H/2+i;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VIEW_W,y);ctx.stroke();
 }
 // فقط غذاهای نزدیک دوربین
 game.foods.forEach(f=>{
  const x=sx(f.x),y=sy(f.y);
  if(x< -10||x>VIEW_W+10||y< -10||y>VIEW_H+10)return;
  ctx.fillStyle="#ffdc51";ctx.shadowBlur=9;ctx.shadowColor="#ffdc51";
  ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();
 });
 ctx.shadowBlur=0;
 game.snakes.forEach(s=>{
  if(!s.alive)return;
  const color=s.bot?"#fa557b":"#27e3bd";
  ctx.strokeStyle=color;ctx.fillStyle=color;
  ctx.lineWidth=12;ctx.lineCap="round";ctx.lineJoin="round";
  // تکه‌ها جدا رسم می‌شوند تا عبور از لبه خط بلند نسازد
  for(let i=0;i<s.body.length-1;i++){
   const a=s.body[i],b=s.body[i+1];
   const dx=torusDelta(a.x,b.x,WORLD),dy=torusDelta(a.y,b.y,WORLD);
   if(Math.hypot(dx,dy)>12)continue;
   const ax=sx(a.x),ay=sy(a.y),bx=ax-dx,by=ay-dy;
   if(Math.max(ax,bx)<-20||Math.min(ax,bx)>VIEW_W+20||Math.max(ay,by)<-20||Math.min(ay,by)>VIEW_H+20)continue;
   ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  const hx=sx(s.x),hy=sy(s.y);
  ctx.beginPath();ctx.arc(hx,hy,7,0,TAU);ctx.fill();
 });
 ctx.shadowBlur=0;
 $("scores").textContent="مارهای زنده: "+game.snakes.length+" | امتیاز تو: "+(game.snakes.find(s=>s.id===myId)?.score||0);
 const t=Math.max(0,game.remaining);
 $("timer").textContent="زمان: "+String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function backRoom(){
 if(!isHost)return;
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 game=null;hide("gamePanel");show("roomPanel");renderRoom();
}
function leaveRoom(){
 clearInterval(moveTimer);clearInterval(secondTimer);clearInterval(sendTimer);
 if(peer)peer.destroy();
 peer=null;conn=null;connections=[];players=[];game=null;solo=false;openLobby();
}
function copyInvite(){
 const link=location.origin+location.pathname+"?room="+roomCode;
 if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>alert("لینک دعوت کپی شد"));
 else prompt("لینک دعوت",link);
}
</script>
</body>
</html>
