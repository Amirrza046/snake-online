
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:#fff;
 font-family:Tahoma,Arial,sans-serif;text-align:center;
}
header{padding:18px 8px;color:#40f5d0;font-size:28px;font-weight:bold}
.panel{
 background:#111c2d;border:1px solid #25445b;
 border-radius:15px;padding:15px;margin:12px auto;
 width:min(94%,520px);
}
h3{color:#40f5d0}
input,select,button{
 width:100%;padding:12px;margin:6px 0;
 border-radius:9px;border:1px solid #34536a;
 background:#0b1422;color:white;font-size:15px;
}
button{background:#087f76;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#263b55}
.danger{background:#a33348}
.hidden{display:none!important}
#players{line-height:2;text-align:right}
#gameCanvas{
 width: min(94vw,600px);height:auto;
 background:#091321;border:2px solid #28d9bd;
 border-radius:12px;display:block;margin:10px auto;
}
#status{color:#ffd66b;min-height:24px}
#roomLink{font-size:12px;direction:ltr;word-break:break-all}
#controls{
 display:grid;grid-template-columns:repeat(3,65px);
 justify-content:center;gap:6px;margin:15px auto;
 direction:ltr;
}
#controls button{height:55px;font-size:22px;margin:0}
#controls .empty{visibility:hidden}
.small{font-size:12px;color:#9eb4c8}
</style>
</head>
<body>

<header>🐍 SNAKE ARENA</header>

<section id="lobby" class="panel">
 <h3>ساخت اتاق یا ورود</h3>
 <input id="playerName" maxlength="14" placeholder="نام بازیکن">

 <button onclick="createRoom()">ساخت اتاق جدید</button>

 <hr style="border-color:#294052">

 <input id="roomCode" placeholder="کد اتاق دوستت">
 <button class="secondary" onclick="joinRoom()">ورود به اتاق</button>
 <div class="small">اگر لینک دعوت داری، آن را باز کن تا کد اتاق خودکار وارد شود.</div>
</section>

<section id="roomPanel" class="panel hidden">
 <h3>اتاق بازی</h3>
 <div>کد اتاق:</div>
 <div id="roomCodeText" style="direction:ltr;color:#40f5d0;word-break:break-all"></div>
 <button class="secondary" onclick="copyInvite()">کپی لینک دعوت</button>
 <div id="roomLink"></div>

 <div id="hostSettings" class="hidden">
  <h3>تنظیمات صاحب اتاق</h3>
  <label>نوع مسابقه</label>
  <select id="mode" onchange="changeMode()">
   <option value="1-1">یک به یک (۱ در برابر ۱)</option>
   <option value="1-2">یک به دو (۱ در برابر ۲)</option>
   <option value="2-2">دو به دو (۲ در برابر ۲)</option>
  </select>

  <label>مدت مسابقه</label>
  <select id="duration">
   <option value="1">۱ دقیقه</option>
   <option value="3">۳ دقیقه</option>
   <option value="5" selected>۵ دقیقه</option>
   <option value="10">۱۰ دقیقه</option>
  </select>
 </div>

 <h3>بازیکنان</h3>
 <div id="players">در انتظار بازیکنان...</div>
 <div id="teamChoice" class="hidden">
  <label>تیم شما</label>
  <select id="teamSelect" onchange="chooseTeam()">
   <option value="A">تیم A</option>
   <option value="B">تیم B</option>
  </select>
 </div>

 <button id="startButton" class="hidden" onclick="startGame()">شروع مسابقه</button>
 <div id="status">در انتظار اتصال...</div>
</section>

<section id="gamePanel" class="panel hidden">
 <h3 id="gameTitle">مسابقه</h3>
 <div id="timer">زمان: 00:00</div>
 <div id="score">تیم A: 0 | تیم B: 0</div>
 <canvas id="gameCanvas" width="600" height="400"></canvas>
 <div id="gameMessage"></div>

 <div id="controls">
  <span class="empty"></span>
  <button onclick="sendDirection(0,-1)">▲</button>
  <span class="empty"></span>
  <button onclick="sendDirection(-1,0)">◀</button>
  <button onclick="sendDirection(0,1)">▼</button>
  <button onclick="sendDirection(1,0)">▶</button>
 </div>
 <div class="small">با کلیدهای جهت‌دار یا دکمه‌های لمسی بازی کن.</div>
 <button id="backButton" class="secondary hidden" onclick="backToRoom()">بازگشت به اتاق</button>
</section>

<script>
const $ = id => document.getElementById(id);

let peer = null;
let hostPeerId = null;
let connection = null;
let isHost = false;
let roomPlayers = [];
let myId = null;
let myTeam = "A";
let game = null;
let gameLoop = null;
let broadcastLoop = null;
let timerLoop = null;
let lastTick = 0;
let roomMode = "1-1";
let roomDuration = 5;
let finished = false;

const canvas = $("gameCanvas");
const ctx = canvas.getContext("2d");
const COLS = 30, ROWS = 20, CELL = 20;

function playerName(){
 return ($("playerName").value.trim() || "بازیکن").slice(0,14);
}

function capacities(mode){
 if(mode==="1-2") return {A:1,B:2};
 if(mode==="2-2") return {A:2,B:2};
 return {A:1,B:1};
}

function requiredPlayers(){
 const c=capacities(roomMode);
 return c.A+c.B;
}

function show(id){
 $(id).classList.remove("hidden");
}
function hide(id){
 $(id).classList.add("hidden");
}

function setStatus(t){ $("status").textContent=t; }

function createRoom(){
 if(typeof Peer==="undefined"){
  alert("کتابخانه اتصال بارگذاری نشد. اینترنت را بررسی کن.");
  return;
 }
 if(peer) peer.destroy();
 isHost=true;
 roomPlayers=[];
 game=null;
 finished=false;

 $("lobby").classList.add("hidden");
 show("roomPanel");
 show("hostSettings");
 show("startButton");
 hide("teamChoice");
 setStatus("در حال ساخت اتاق...");

 peer=new Peer();
 peer.on("open",id=>{
  myId=id;
  hostPeerId=id;
  roomPlayers=[{
   id:id,name:playerName(),team:"A",host:true
  }];
  myTeam="A";
  $("roomCodeText").textContent=id;
  $("roomLink").textContent=inviteUrl();
  updateRoom();
  setStatus("اتاق ساخته شد. دوستانت را دعوت کن.");
 });
 peer.on("connection",conn=>{
  conn.on("open",()=>{
   conn.on("data",data=>handleHostData(conn,data));
   conn.on("close",()=>{
    roomPlayers=roomPlayers.filter(p=>p.id!==conn.peer);
    updateRoom();
   });
  });
 });
 peer.on("error",err=>{
  setStatus("خطای اتصال: "+err.type);
 });
}

function inviteUrl(){
 const u=new URL(location.href);
 u.searchParams.set("room",hostPeerId);
 return u.toString();
}

function copyInvite(){
 const link=inviteUrl();
 if(navigator.clipboard){
  navigator.clipboard.writeText(link).then(()=>setStatus("لینک دعوت کپی شد."));
 }else{
  prompt("لینک دعوت را کپی کن:",link);
 }
}

function joinRoom(){
 const code=$("roomCode").value.trim() ||
  new URLSearchParams(location.search).get("room");
 if(!code){alert("کد اتاق را وارد کن.");return}
 if(typeof Peer==="undefined"){alert("اینترنت را بررسی کن.");return}

 if(peer) peer.destroy();
 isHost=false;
 hostPeerId=code;
 $("lobby").classList.add("hidden");
 show("roomPanel");
 hide("hostSettings");
 hide("startButton");
 show("teamChoice");
 setStatus("در حال اتصال به صاحب اتاق...");

 peer=new Peer();
 peer.on("open",id=>{
  myId=id;
  connection=peer.connect(hostPeerId,{reliable:true});
  connection.on("open",()=>{
   connection.send({
    type:"join",name:playerName(),team:$("teamSelect").value
   });
   setStatus("درخواست ورود ارسال شد...");
  });
  connection.on("data",data=>handleGuestData(data));
  connection.on("close",()=>{
   setStatus("ارتباط با اتاق قطع شد.");
  });
 });
 peer.on("error",err=>{
  setStatus("اتصال ناموفق: "+err.type);
 });
}

function handleHostData(conn,data){
 if(!data || !data.type) return;

 if(data.type==="join"){
  if(roomPlayers.some(p=>p.id===conn.peer)) return;
  if(roomPlayers.length>=4){
   conn.send({type:"reject",reason:"ظرفیت اتاق پر است."});
   return;
  }
  const p={
   id:conn.peer,
   name:String(data.name||"بازیکن").slice(0,14),
   team:"A",host:false
  };
  roomPlayers.push(p);
  conn.send({type:"joined",id:p.id});
  updateRoom();
  return;
 }

 if(data.type==="team"){
  const p=roomPlayers.find(x=>x.id===conn.peer);
  if(!p || game) return;
  const c=capacities(roomMode);
  const team=data.team==="B"?"B":"A";
  const count=roomPlayers.filter(x=>x.team===team && x.id!==p.id).length;
  if(count<c[team]) p.team=team;
  conn.send({type:"room",players:roomPlayers,mode:roomMode,duration:roomDuration});
  updateRoom();
  return;
 }

 if(data.type==="direction" && game){
  const snake=game.snakes.find(s=>s.id===conn.peer);
  if(snake && data.dir) setSnakeDirection(snake,data.dir);
 }
}

function handleGuestData(data){
 if(!data || !data.type) return;

 if(data.type==="reject"){
  setStatus(data.reason);
  return;
 }
 if(data.type==="joined"){
  myId=data.id;
  return;
 }
 if(data.type==="room"){
  roomPlayers=data.players||[];
  roomMode=data.mode||"1-1";
  roomDuration=Number(data.duration)||5;
  const me=roomPlayers.find(p=>p.id===myId);
  if(me) myTeam=me.team;
  $("teamSelect").value=myTeam;
  renderPlayers();
  return;
 }
 if(data.type==="started"){
  game=data.game;
  finished=false;
  openGame();
  return;
 }
 if(data.type==="state"){
  game=data.game;
  renderGame();
  return;
 }
 if(data.type==="ended"){
  game=data.game;
  finished=true;
  renderGame();
  $("gameMessage").textContent=data.message;
  show("backButton");
 }
}

function chooseTeam(){
 myTeam=$("teamSelect").value;
 if(connection && connection.open){
  connection.send({type:"team",team:myTeam});
 }
}

function changeMode(){
 if(!isHost || game) return;
 roomMode=$("mode").value;
 updateRoom();
}

function updateRoom(){
 if(!isHost) return;
 roomMode=$("mode").value;
 roomDuration=Number($("duration").value);
 const c=capacities(roomMode);
 if(roomPlayers.filter(p=>p.team==="A").length>c.A){
  roomPlayers.filter(p=>p.team==="A").slice(c.A).forEach(p=>p.team="B");
 }
 if(roomPlayers.filter(p=>p.team==="B").length>c.B){
  roomPlayers.filter(p=>p.team==="B").slice(c.B).forEach(p=>p.team="A");
 }
 renderPlayers();
 broadcastRoom();
 const ready=roomPlayers.length===requiredPlayers() &&
  roomPlayers.filter(p=>p.team==="A").length===c.A &&
  roomPlayers.filter(p=>p.team==="B").length===c.B;
 $("startButton").disabled=!ready;
 setStatus(ready?"همه بازیکنان آماده‌اند. می‌توانی شروع کنی.":"منتظر تکمیل بازیکنان و تیم‌ها...");
}

function renderPlayers(){
 const c=capacities(roomMode);
 $("players").innerHTML=
  "<b>تیم A ("+roomPlayers.filter(p=>p.team==="A").length+"/"+c.A+")</b><br>"+
  roomPlayers.filter(p=>p.team==="A").map(p=>escapeHtml(p.name)+(p.host?" 👑":"")).join("<br>")+
  "<br><br><b>تیم B ("+roomPlayers.filter(p=>p.team==="B").length+"/"+c.B+")</b><br>"+
  roomPlayers.filter(p=>p.team==="B").map(p=>escapeHtml(p.name)+(p.host?" 👑":"")).join("<br>")+
  "<br><br><b>کل بازیکنان: "+roomPlayers.length+"/4</b>";
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function broadcastRoom(){
 const packet={
  type:"room",players:roomPlayers,mode:roomMode,duration:roomDuration
 };
 if(peer && isHost){
  peer.connections && Object.values(peer.connections).flat().forEach(c=>{
   if(c.open) c.send(packet);
  });
 }
}

function startGame(){
 if(!isHost || $("startButton").disabled) return;
 const c=capacities(roomMode);
 const a=roomPlayers.filter(p=>p.team==="A");
 const b=roomPlayers.filter(p=>p.team==="B");
 if(a.length!==c.A || b.length!==c.B){
  alert("تعداد بازیکنان تیم‌ها کامل نیست.");return;
 }

 const snakes=[];
 function addTeam(list,team){
  list.forEach((p,i)=>{
   const x=team==="A"?5:24;
   const y=list.length===1?10:(i===0?6:14);
   const dir=team==="A"?{x:1,y:0}:{x:-1,y:0};
   snakes.push({
    id:p.id,name:p.name,team:team,alive:true,
    dir:dir,nextDir:dir,
    body:[{x,y},{x:x-dir.x,y},{x:x-2*dir.x,y}]
   });
  });
 }
 addTeam(a,"A");addTeam(b,"B");

 game={
  snakes:snakes,
  remaining:roomDuration*60,
  tick:0,
  over:false,
  winner:null
 };
 finished=false;
 broadcastPacket({type:"started",game:game});
 openGame();
 runHostGame();
}

function broadcastPacket(packet){
 if(!peer || !isHost) return;
 Object.values(peer.connections||{}).flat().forEach(c=>{
  if(c.open) c.send(packet);
 });
}

function openGame(){
 hide("lobby");hide("roomPanel");show("gamePanel");
 $("gameTitle").textContent="Snake Arena | "+roomMode.replace("-"," در برابر ");
 $("gameMessage").textContent="";
 hide("backButton");
 renderGame();
}

function setSnakeDirection(s,d){
 if(!d || (d.x===-s.dir.x && d.y===-s.dir.y)) return;
 s.nextDir={x:d.x,y:d.y};
}

function sendDirection(x,y){
 const d={x,y};
 if(isHost && game && !finished){
  const s=game.snakes.find(s=>s.id===myId);
  if(s) setSnakeDirection(s,d);
 }else if(connection && connection.open){
  connection.send({type:"direction",dir:d});
 }
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]
 };
 const k=keys[e.key];
 if(k){e.preventDefault();sendDirection(k[0],k[1]);}
});

function runHostGame(){
 if(gameLoop) clearInterval(gameLoop);
 if(broadcastLoop) clearInterval(broadcastLoop);
 if(timerLoop) clearInterval(timerLoop);
 lastTick=Date.now();

 gameLoop=setInterval(()=>{
  if(!game || game.over) return;
  game.tick++;
  game.snakes.forEach(s=>{
   if(!s.alive) return;
   s.dir=s.nextDir;
   const head={
    x:s.body[0].x+s.dir.x,
    y:s.body[0].y+s.dir.y
   };
   const wall=head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS;
   const self=s.body.slice(0,-1).some(p=>p.x===head.x&&p.y===head.y);
   const other=game.snakes.some(o=>o.body.some((p,i)=>
    !(o.id===s.id && i===o.body.length-1) &&
    p.x===head.x && p.y===head.y
   ));
   if(wall || self || other){
    s.alive=false;
    return;
   }
   s.body.unshift(head);
   s.body.pop();
  });

  const aliveA=game.snakes.filter(s=>s.team==="A"&&s.alive).length;
  const aliveB=game.snakes.filter(s=>s.team==="B"&&s.alive).length;
  if(aliveA===0 || aliveB===0){
   endGame(aliveA>aliveB?"تیم A برنده شد!":"تیم B برنده شد!");
  }
 },140);

 broadcastLoop=setInterval(()=>{
  if(game && !game.over) broadcastPacket({type:"state",game:game});
 },100);

 timerLoop=setInterval(()=>{
  if(!game || game.over) return;
  game.remaining--;
  if(game.remaining<=0){
   const a=game.snakes.filter(s=>s.team==="A"&&s.alive).length;
   const b=game.snakes.filter(s=>s.team==="B"&&s.alive).length;
   endGame(a===b?"مسابقه مساوی شد!":a>b?"تیم A برنده شد!":"تیم B برنده شد!");
  }
 },1000);
}

function endGame(message){
 if(!game || game.over) return;
 game.over=true;
 finished=true;
 clearInterval(gameLoop);
 clearInterval(broadcastLoop);
 clearInterval(timerLoop);
 broadcastPacket({type:"ended",game:game,message:message});
 $("gameMessage").textContent=message;
 show("backButton");
 renderGame();
}

function renderGame(){
 if(!game) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#091321";
 ctx.fillRect(0,0,600,400);

 ctx.strokeStyle="#14273b";
 for(let x=0;x<=600;x+=20){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();
 }
 for(let y=0;y<=400;y+=20){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke();
 }

 game.snakes.forEach(s=>{
  s.body.forEach((p,i)=>{
   ctx.fillStyle=s.team==="A"?"#29e6c0":"#ff5475";
   ctx.globalAlpha=s.alive?1:.25;
   ctx.fillRect(p.x*CELL+1,p.y*CELL+1,CELL-2,CELL-2);
   if(i===0 && s.alive){
    ctx.fillStyle="#fff";
    ctx.fillRect(p.x*CELL+6,p.y*CELL+6,5,5);
   }
  });
 });
 ctx.globalAlpha=1;

 const a=game.snakes.filter(s=>s.team==="A"&&s.alive).length;
 const b=game.snakes.filter(s=>s.team==="B"&&s.alive).length;
 $("score").textContent="تیم A زنده: "+a+" | تیم B زنده: "+b;
 const sec=Math.max(0,game.remaining||0);
 $("timer").textContent="زمان: "+String(Math.floor(sec/60)).padStart(2,"0")+":"+
  String(sec%60).padStart(2,"0");
}

function backToRoom(){
 if(!isHost){
  alert("برای برگشت به اتاق، صفحه را دوباره با لینک دعوت باز کن.");
  return;
 }
 clearInterval(gameLoop);
 clearInterval(broadcastLoop);
 clearInterval(timerLoop);
 game=null;finished=false;
 hide("gamePanel");show("roomPanel");
 updateRoom();
}

const roomFromUrl=new URLSearchParams(location.search).get("room");
if(roomFromUrl){
 $("roomCode").value=roomFromUrl;
}
</script>
</body>
</html>
