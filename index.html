
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111e;color:white;font-family:Tahoma;text-align:center}
header{padding:22px;color:#40f5d0;font-size:29px;font-weight:bold}
.panel{width:94%;max-width:540px;margin:12px auto;padding:17px;background:#122338;border:1px solid #28536a;border-radius:18px}
h3{color:#40f5d0}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #34536a;background:#091725;color:white;font-size:15px}
button{background:#087f78;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.hidden{display:none!important}
.small{font-size:12px;color:#a9c2d4;line-height:1.8}
#players{line-height:2.2;text-align:right}
#status{color:#ffda70;margin:10px;line-height:1.8}
#roomCodeText{direction:ltr;color:#40f5d0;word-break:break-all;font-size:20px}
#gameCanvas{width:100%;height:auto;background:#081522;border:2px solid #40e8c7;border-radius:12px;touch-action:none}
#controls{display:grid;grid-template-columns:65px 65px 65px;gap:6px;justify-content:center;direction:ltr}
#controls button{height:55px;font-size:22px;margin:0}
.empty{visibility:hidden}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.avatar{font-size:30px;padding:12px;background:#091725;border:2px solid #34536a;border-radius:12px;cursor:pointer}
.avatar.selected{border-color:#40f5d0;background:#16434b}
.player{padding:5px 8px;border-bottom:1px solid #294052}
</style>
</head>
<body>
<header>🐍 SNAKE ARENA</header>

<section id="profile" class="panel hidden">
<h3>پروفایل بازیکن</h3>
<input id="name" maxlength="16" placeholder="نام بازیکن">
<select id="gender">
<option value="">جنسیت</option>
<option>پسر</option>
<option>دختر</option>
<option>بدون اعلام</option>
</select>
<h3>انتخاب تصویر پروفایل</h3>
<div class="avatars" id="avatarChoices"></div>
<button onclick="saveProfile()">ذخیره پروفایل</button>
</section>

<section id="lobby" class="panel hidden">
<h3>سلام <span id="welcome"></span> 👋</h3>
<div id="myProfile"></div>
<button onclick="createRoom()">ساخت اتاق جدید</button>
<input id="roomInput" placeholder="کد اتاق">
<button onclick="joinRoom()">پیوستن به اتاق</button>
<button onclick="editProfile()">ویرایش پروفایل</button>
</section>

<section id="roomPanel" class="panel hidden">
<h3>🏟️ اتاق بازی</h3>
<div>کد اتاق:</div>
<div id="roomCodeText"></div>
<button onclick="copyInvite()">کپی لینک دعوت</button>
<div class="small" id="inviteText"></div>
<div id="hostSettings" class="hidden">
<h3>تنظیمات صاحب اتاق</h3>
<select id="mode" onchange="changeSettings()">
<option value="1-1">۱ به ۱</option>
<option value="1-2">۱ به ۲</option>
<option value="2-2">۲ به ۲</option>
</select>
<select id="duration" onchange="changeSettings()">
<option value="1">۱ دقیقه</option>
<option value="3">۳ دقیقه</option>
<option value="5" selected>۵ دقیقه</option>
<option value="10">۱۰ دقیقه</option>
</select>
</div>
<h3>بازیکنان</h3>
<div id="players"></div>
<div id="status">در انتظار بازیکنان...</div>
<button id="start" class="hidden" onclick="startGame()">شروع مسابقه</button>
<button onclick="leaveRoom()">خروج از اتاق</button>
</section>

<section id="gamePanel" class="panel hidden">
<h3>⚔️ Snake Arena</h3>
<div id="timer">زمان: 00:00</div>
<div id="scores"></div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<h3 id="message"></h3>
<div id="controls">
<span class="empty"></span><button onclick="move(0,-1)">▲</button><span class="empty"></span>
<button onclick="move(-1,0)">◀</button><button onclick="move(0,1)">▼</button><button onclick="move(1,0)">▶</button>
</div>
<button id="back" class="hidden" onclick="backRoom()">بازگشت به اتاق</button>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$("gameCanvas"),ctx=canvas.getContext("2d");
const W=30,H=20;
const AVATARS=["🐉","🦊","🐼","🐯","🦁","🐸","🤖","👽","🐺","🐵","🐨","🦄"];

let profile=null,selectedAvatar="🐉";
let peer=null,conn=null,isHost=false,myId="",roomCode="",hostPeerId="";
let players=[],connections={},mode="1-1",duration=5,game=null;
let moveLoop=null,timeLoop=null,sendLoop=null,joinTimeout=null;
let creating=false;

function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function status(t){$("status").textContent=t}
function capacity(){return mode==="1-1"?2:mode==="1-2"?3:4}
function teamIndex(i){
 if(mode==="1-1")return i===0?"A":"B";
 if(mode==="1-2")return i===0?"A":"B";
 return i%2?"B":"A";
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function drawAvatarChoices(){
 $("avatarChoices").innerHTML="";
 AVATARS.forEach(a=>{
  const b=document.createElement("button");
  b.className="avatar"+(a===selectedAvatar?" selected":"");
  b.textContent=a;
  b.type="button";
  b.onclick=()=>{
   selectedAvatar=a;
   drawAvatarChoices();
  };
  $("avatarChoices").appendChild(b);
 });
}

function saveProfile(){
 const n=$("name").value.trim(),g=$("gender").value;
 if(!n||!g){alert("نام و جنسیت را وارد کن.");return}
 profile={name:n,gender:g,avatar:selectedAvatar};
 localStorage.setItem("snakeProfile",JSON.stringify(profile));
 openLobby();

 // اگر بازیکن از لینک دعوت آمده، بعد از ساخت پروفایل خودکار وصل شود
 const invite=new URLSearchParams(location.search).get("room");
 if(invite){
  $("roomInput").value=invite;
  setTimeout(joinRoom,300);
 }
}

function openLobby(){
 hide("profile");show("lobby");
 $("welcome").textContent=profile.name;
 $("myProfile").textContent=profile.avatar+" تصویر پروفایل تو";
}

function editProfile(){
 $("name").value=profile.name;
 $("gender").value=profile.gender;
 selectedAvatar=profile.avatar||"🐉";
 drawAvatarChoices();
 hide("lobby");show("profile");
}

function uniqueCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const bytes=crypto.getRandomValues(new Uint8Array(12));
 return Array.from(bytes,b=>chars[b%chars.length]).join("");
}

function inviteLink(){
 const u=new URL(location.href);
 u.search="";
 u.searchParams.set("room",roomCode);
 return u.href;
}

async function copyInvite(){
 const link=inviteLink();
 try{
  await navigator.clipboard.writeText(link);
  alert("لینک دعوت کپی شد!");
 }catch(e){
  prompt("لینک دعوت را کپی کن:",link);
 }
}

function clearTimers(){
 clearInterval(moveLoop);
 clearInterval(timeLoop);
 clearInterval(sendLoop);
 clearTimeout(joinTimeout);
}

function destroyPeer(){
 if(peer){
  try{peer.destroy()}catch(e){}
 }
 peer=null;conn=null;connections={};
}

function createRoom(){
 if(!window.Peer){
  alert("کتابخانه اتصال بارگذاری نشده؛ اینترنت را بررسی کن.");
  return;
 }
 clearTimers();
 destroyPeer();
 isHost=true;
 creating=true;
 players=[];
 game=null;
 tryCreateRoom(0);
}

function tryCreateRoom(attempt){
 if(attempt>=6){
  status("ساخت اتاق ناموفق شد. دوباره تلاش کن.");
  return;
 }
 roomCode=uniqueCode();
 hostPeerId="snakearena-"+roomCode.toLowerCase();
 $("roomCodeText").textContent=roomCode;
 $("inviteText").textContent=inviteLink();
 show("roomPanel");hide("lobby");
 show("hostSettings");show("start");
 status("در حال اتصال به سرور و ساخت اتاق...");
 peer=new Peer(hostPeerId,{debug:0});

 peer.on("open",id=>{
  creating=false;
  myId=id;
  players=[{
   id,name:profile.name,gender:profile.gender,
   avatar:profile.avatar||"🐉",team:"A",host:true
  }];
  renderRoom();
  status("اتاق آماده است؛ لینک دعوت را برای دوستانت بفرست.");
 });

 peer.on("connection",c=>{
  connections[c.peer]=c;
  c.on("data",d=>hostMessage(c,d));
  c.on("open",()=>{
   if(players.some(p=>p.id===c.peer))sendRoomTo(c);
  });
  c.on("close",()=>{
   delete connections[c.peer];
   players=players.filter(p=>p.id!==c.peer);
   rebalance();
   renderRoom();
  });
  c.on("error",()=>status("ارتباط با یکی از بازیکنان دچار مشکل شد."));
 });

 peer.on("error",e=>{
  if(e.type==="unavailable-id"&&creating){
   try{peer.destroy()}catch(x){}
   peer=null;
   tryCreateRoom(attempt+1);
   return;
  }
  status("خطای اتصال: "+e.type+" — اینترنت را بررسی کن.");
 });
}

function joinRoom(){
 const code=($("roomInput").value||
  new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();

 if(!code){alert("کد اتاق را وارد کن.");return}
 if(!window.Peer){alert("کتابخانه اتصال بارگذاری نشده؛ اینترنت را بررسی کن.");return}
 if(!profile){alert("اول پروفایلت را بساز.");return}

 clearTimers();
 destroyPeer();
 isHost=false;
 roomCode=code;
 hostPeerId="snakearena-"+code.toLowerCase();
 show("roomPanel");hide("lobby");
 hide("hostSettings");hide("start");
 $("roomCodeText").textContent=code;
 $("inviteText").textContent=inviteLink();
 status("در حال اتصال به سرور...");

 peer=new Peer({debug:0});

 peer.on("open",id=>{
  myId=id;
  status("سرور پیدا شد؛ در حال اتصال به صاحب اتاق...");
  conn=peer.connect(hostPeerId,{reliable:true});

  conn.on("data",guestMessage);
  conn.on("open",()=>{
   status("ارتباط برقرار شد؛ در حال ورود به اتاق...");
   conn.send({
    type:"join",
    name:profile.name,
    gender:profile.gender,
    avatar:profile.avatar||"🐉"
   });
   clearTimeout(joinTimeout);
   joinTimeout=setTimeout(()=>{
    if(!players.length)status("هنوز پاسخی از اتاق دریافت نشده؛ دوباره تلاش کن.");
   },9000);
  });
  conn.on("error",()=>status("خطا در ارتباط با صاحب اتاق."));
  conn.on("close",()=>status("ارتباط با اتاق قطع شد."));
 });

 peer.on("error",e=>{
  let msg="خطای اتصال: "+e.type;
  if(e.type==="peer-unavailable")msg="اتاق پیدا نشد یا صاحب اتاق آنلاین نیست.";
  if(e.type==="network"||e.type==="server-error")msg="اتصال به سرور برقرار نشد؛ اینترنت یا فیلترشکن را بررسی کن.";
  status(msg);
 });
}

function hostMessage(c,d){
 if(!d||!d.type)return;

 if(d.type==="join"){
  if(players.some(p=>p.id===c.peer)){
   sendRoomTo(c);return;
  }
  if(players.length>=capacity()){
   c.send({type:"reject",message:"ظرفیت این مسابقه پر است."});
   return;
  }
  players.push({
   id:c.peer,
   name:String(d.name||"بازیکن").slice(0,16),
   gender:d.gender||"",
   avatar:AVATARS.includes(d.avatar)?d.avatar:"🐉",
   team:"B",host:false
  });
  rebalance();
  renderRoom();
  sendRoomTo(c);
  return;
 }

 if(d.type==="direction"&&game&&!game.over){
  const s=game.snakes.find(x=>x.id===c.peer);
  if(s)setDirection(s,d.dir);
 }
}

function sendRoomTo(c){
 if(c&&c.open)c.send({type:"room",players,mode,duration});
}

function guestMessage(d){
 if(!d)return;
 clearTimeout(joinTimeout);

 if(d.type==="reject"){
  status(d.message);
  return;
 }
 if(d.type==="room"){
  players=d.players||[];
  mode=d.mode;
  duration=d.duration;
  renderPlayers();
  status("با موفقیت وارد اتاق شدی!");
 }
 if(d.type==="started"){
  game=d.game;
  openGame();
 }
 if(d.type==="state"){
  game=d.game;
  draw();
 }
 if(d.type==="ended"){
  game=d.game;
  draw();
  $("message").textContent=d.message;
  show("back");
 }
 if(d.type==="backRoom"){
  game=null;
  hide("gamePanel");show("roomPanel");
  players=d.players||players;
  mode=d.mode||mode;
  renderPlayers();
  status("به اتاق برگشتی.");
 }
}

function rebalance(){
 players.forEach((p,i)=>p.team=teamIndex(i));
}

function changeSettings(){
 if(!isHost||game)return;
 mode=$("mode").value;
 duration=Number($("duration").value);
 rebalance();
 renderRoom();
}

function renderPlayers(){
 const a=players.filter(p=>p.team==="A");
 const b=players.filter(p=>p.team==="B");
 const capA=mode==="2-2"?2:1;
 const capB=mode==="1-2"?2:mode==="2-2"?2:1;

 $("players").innerHTML=
 '<b style="color:#40f5d0">تیم A ('+a.length+'/'+capA+')</b><br>'+
 a.map(p=>'<div class="player">'+esc(p.avatar||"🐉")+' '+esc(p.name)+(p.host?" 👑":"")+'</div>').join("")+
 '<br><b style="color:#ff7796">تیم B ('+b.length+'/'+capB+')</b><br>'+
 b.map(p=>'<div class="player">'+esc(p.avatar||"🐉")+' '+esc(p.name)+(p.host?" 👑":"")+'</div>').join("")+
 '<br><br>کل بازیکنان: '+players.length+'/'+capacity();
}

function renderRoom(){
 renderPlayers();
 if(!isHost)return;
 sendAll({type:"room",players,mode,duration});
 const ready=players.length===capacity();
 $("start").disabled=!ready;
 status(ready?"تیم‌ها کامل هستند؛ مسابقه را شروع کن!":
  "در انتظار "+(capacity()-players.length)+" بازیکن دیگر...");
}

function sendAll(d){
 if(!isHost)return;
 Object.values(connections).forEach(c=>{
  if(c&&c.open){
   try{c.send(d)}catch(e){}
  }
 });
}

function startGame(){
 if(!isHost||players.length!==capacity())return;

 game={
  remaining:duration*60,
  over:false,
  food:{x:15,y:10},
  snakes:players.map(p=>{
   const team=p.team;
   const x=team==="A"?5:24;
   const teamPlayers=players.filter(q=>q.team===team);
   const position=teamPlayers.findIndex(q=>q.id===p.id);
   const y=teamPlayers.length===1?10:(position===0?6:14);
   const dir={x:team==="A"?1:-1,y:0};
   return {
    id:p.id,name:p.name,avatar:p.avatar||"🐉",
    team,alive:true,score:0,dir,nextDir:dir,
    body:[{x,y},{x:x-dir.x,y},{x:x-2*dir.x,y}]
   };
  })
 };

 sendAll({type:"started",game});
 openGame();
 runHost();
}

function openGame(){
 hide("roomPanel");hide("lobby");
 show("gamePanel");hide("back");
 $("message").textContent="";
 draw();
}

function setDirection(s,d){
 if(!d||!Number.isFinite(d.x)||!Number.isFinite(d.y))return;
 if(d.x===-s.dir.x&&d.y===-s.dir.y)return;
 s.nextDir=d;
}

function move(x,y){
 if(!game||game.over)return;
 const d={x,y};
 if(isHost){
  const s=game.snakes.find(s=>s.id===myId);
  if(s)setDirection(s,d);
 }else if(conn&&conn.open){
  conn.send({type:"direction",dir:d});
 }
}

document.addEventListener("keydown",e=>{
 const m={
  ArrowUp:[0,-1],ArrowDown:[0,1],
  ArrowLeft:[-1,0],ArrowRight:[1,0],
  w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]
 };
 if(m[e.key]){
  e.preventDefault();
  move(...m[e.key]);
 }
});

function food(){
 let p;
 do{
  p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};
 }while(game.snakes.some(s=>s.body.some(b=>b.x===p.x&&b.y===p.y)));
 return p;
}

function runHost(){
 clearTimers();

 moveLoop=setInterval(()=>{
  if(!game||game.over)return;

  const heads=game.snakes.map(s=>s.alive?
   {x:s.body[0].x+s.nextDir.x,y:s.body[0].y+s.nextDir.y}:null);

  game.snakes.forEach((s,i)=>{
   if(!s.alive)return;
   s.dir=s.nextDir;
   const h=heads[i];
   const eat=h.x===game.food.x&&h.y===game.food.y;
   const wall=h.x<0||h.x>=W||h.y<0||h.y>=H;

   const self=s.body.slice(0,eat?s.body.length:s.body.length-1)
    .some(p=>p.x===h.x&&p.y===h.y);

   const other=game.snakes.some((o,j)=>{
    if(j===i)return false;
    return o.body.slice(0,o.body.length-1)
     .some(p=>p.x===h.x&&p.y===h.y);
   });

   const sameHead=heads.some((v,j)=>j!==i&&v&&v.x===h.x&&v.y===h.y);

   if(wall||self||other||sameHead){
    s.alive=false;
    return;
   }

   s.body.unshift(h);
   if(eat){
    s.score++;
    game.food=food();
   }else{
    s.body.pop();
   }
  });

  const a=game.snakes.some(s=>s.team==="A"&&s.alive);
  const b=game.snakes.some(s=>s.team==="B"&&s.alive);
  if(!a||!b)finish(a?"تیم A برنده شد!":"تیم B برنده شد!");
 },130);

 timeLoop=setInterval(()=>{
  if(!game||game.over)return;
  game.remaining--;
  if(game.remaining<=0){
   const a=game.snakes.filter(s=>s.team==="A").reduce((n,s)=>n+s.score,0);
   const b=game.snakes.filter(s=>s.team==="B").reduce((n,s)=>n+s.score,0);
   finish(a===b?"مساوی شد!":a>b?"تیم A برنده شد!":"تیم B برنده شد!");
  }
 },1000);

 sendLoop=setInterval(()=>{
  if(game&&!game.over){
   sendAll({type:"state",game});
   draw();
  }
 },100);
}

function finish(msg){
 if(!game||game.over)return;
 game.over=true;
 clearTimers();
 $("message").textContent=msg;
 show("back");
 sendAll({type:"ended",game,message:msg});
 draw();
}

function draw(){
 if(!game)return;
 ctx.fillStyle="#081522";
 ctx.fillRect(0,0,600,400);
 ctx.strokeStyle="#142b40";

 for(let x=0;x<=600;x+=20){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();
 }
 for(let y=0;y<=400;y+=20){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke();
 }

 const f=game.food;
 ctx.fillStyle="#ffdc51";
 ctx.shadowBlur=17;ctx.shadowColor="#ffdc51";
 ctx.beginPath();ctx.arc(f.x*20+10,f.y*20+10,8,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;

 game.snakes.forEach(s=>{
  s.body.forEach((p,i)=>{
   ctx.globalAlpha=s.alive?1:.25;
   ctx.fillStyle=s.team==="A"?"#27e3bd":"#fa557b";
   ctx.shadowBlur=i===0?12:4;
   ctx.shadowColor=ctx.fillStyle;
   ctx.beginPath();
   ctx.roundRect(p.x*20+2,p.y*20+2,16,16,6);
   ctx.fill();

   if(i===0){
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
    ctx.font="16px Arial";
    ctx.textAlign="center";
    ctx.fillText(s.avatar||"🐍",p.x*20+10,p.y*20+15);
   }
  });
 });

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;

 const a=game.snakes.filter(s=>s.team==="A").reduce((n,s)=>n+s.score,0);
 const b=game.snakes.filter(s=>s.team==="B").reduce((n,s)=>n+s.score,0);
 $("scores").textContent="تیم A: "+a+" | تیم B: "+b;

 const t=Math.max(0,game.remaining);
 $("timer").textContent="زمان: "+
  String(Math.floor(t/60)).padStart(2,"0")+":"+
  String(t%60).padStart(2,"0");
}

function backRoom(){
 if(!isHost)return;
 clearTimers();
 game=null;
 hide("gamePanel");show("roomPanel");
 sendAll({type:"backRoom",players,mode,duration});
 renderRoom();
}

function leaveRoom(){
 clearTimers();
 destroyPeer();
 players=[];
 game=null;
 isHost=false;
 hide("roomPanel");hide("gamePanel");
 show("lobby");
}

try{
 profile=JSON.parse(localStorage.getItem("snakeProfile"));
}catch(e){
 profile=null;
}

drawAvatarChoices();

const invite=new URLSearchParams(location.search).get("room");
if(profile&&profile.name&&profile.gender){
 openLobby();
 if(invite){
  $("roomInput").value=invite;
  setTimeout(joinRoom,500);
 }
}else{
 show("profile");
}
