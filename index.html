
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center}
header{padding:18px;background:#192338;font-size:25px;font-weight:bold;color:#65e6ad}
main{max-width:650px;margin:auto;padding:14px}
.panel{background:#1b263b;border:1px solid #34445f;border-radius:16px;padding:16px;margin:12px 0}
input,select,button{font:inherit;border:0;border-radius:10px;padding:12px;margin:5px}
input,select{background:#0e1728;color:white;width:min(100%,280px)}
button{background:#25b981;color:#071a14;font-weight:bold;cursor:pointer}
button.secondary{background:#40516e;color:white}
button.danger{background:#d84d5d;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
#avatars{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}
.avatar{font-size:28px;background:#293750;border:2px solid transparent;border-radius:12px;padding:8px;cursor:pointer}
.avatar.selected{border-color:#4be2a2;background:#36516b}
.player{display:flex;align-items:center;justify-content:space-between;background:#263650;border-radius:10px;padding:9px;margin:6px 0}
#status{color:#ffd36b;min-height:24px;font-size:13px}
#gameCanvas{width:100%;max-width:480px;background:#09111d;border:3px solid #435777;border-radius:12px;display:block;margin:12px auto}
#controls{display:grid;grid-template-columns:repeat(3,65px);gap:7px;justify-content:center;margin:12px}
#controls button{font-size:22px;padding:12px}
.small{font-size:12px;color:#b8c6dc}
</style>
</head>
<body>
<header>🐍 SNAKE ARENA</header>
<main>

<section id="profile" class="panel">
<h3>ساخت پروفایل بازیکن</h3>
<input id="playerName" maxlength="16" placeholder="اسم بازیکن">
<div class="small">آواتارت را انتخاب کن:</div>
<div id="avatars"></div>
<button onclick="saveProfile()">ذخیره و ادامه</button>
</section>

<section id="home" class="panel hidden">
<h3>سلام <span id="myName"></span> 👋</h3>
<button onclick="createRoom()">ساخت اتاق جدید</button>
<div>
<input id="roomInput" maxlength="6" placeholder="کد اتاق">
<button onclick="joinByCode()">پیوستن به اتاق</button>
</div>
</section>

<section id="room" class="panel hidden">
<h3>اتاق بازی</h3>
<p>کد اتاق: <b id="roomCode">---</b></p>
<button class="secondary" onclick="copyInvite()">کپی لینک دعوت</button>
<p id="roomStatus" class="small">در انتظار بازیکنان...</p>
<h4>بازیکنان اتاق</h4>
<div id="playerList"></div>
<div id="hostOptions" class="hidden">
<h4>تنظیم مسابقه (فقط میزبان)</h4>
<select id="mode">
<option value="2">۱ به ۱ - دو بازیکن</option>
<option value="3">۱ به ۲ - سه بازیکن</option>
<option value="4">۲ به ۲ - چهار بازیکن</option>
</select>
<select id="duration">
<option value="60">۱ دقیقه</option>
<option value="120">۲ دقیقه</option>
<option value="180">۳ دقیقه</option>
<option value="300">۵ دقیقه</option>
</select>
<button onclick="startGame()">شروع مسابقه</button>
</div>
<button class="danger" onclick="leaveRoom()">خروج از اتاق</button>
</section>

<section id="game" class="panel hidden">
<h3 id="gameTitle">مسابقه شروع شد!</h3>
<p id="gameInfo"></p>
<canvas id="gameCanvas" width="480" height="480"></canvas>
<div id="controls">
<span></span><button onclick="sendDirection('up')">⬆️</button><span></span>
<button onclick="sendDirection('left')">⬅️</button>
<button onclick="sendDirection('down')">⬇️</button>
<button onclick="sendDirection('right')">➡️</button>
</div>
<p class="small">برای حرکت می‌توانی از کلیدهای جهت‌دار یا دکمه‌ها استفاده کنی.</p>
<button class="secondary" onclick="requestBackRoom()">بازگشت به اتاق</button>
</section>

<div id="status"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const avatars = ["🐍","🐲","🦊","🐼","🐯","🦁","🐸","🐵","🐺","🐻","🐙","🦄"];
let avatarChoice = "🐍";
let profile = JSON.parse(localStorage.getItem("snakeProfile") || "null");
let peer = null, host = false, room = null, myId = null;
let connections = {}, players = [], gameState = null;
let gameTimer = null, tickTimer = null, endAt = 0;
let inviteRoom = new URLSearchParams(location.search).get("room");

function say(t){ $("status").textContent = t; }
function show(id){
  ["profile","home","room","game"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}
function randomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  for(let i=0;i<6;i++) out += chars[bytes[i] % chars.length];
  return out;
}
function makeAvatars(){
  $("avatars").innerHTML = "";
  avatars.forEach(a=>{
    const b=document.createElement("button");
    b.className="avatar"+(a===avatarChoice?" selected":"");
    b.textContent=a;
    b.onclick=()=>{
      avatarChoice=a;
      document.querySelectorAll(".avatar").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    };
    $("avatars").appendChild(b);
  });
}
function loadProfile(){
  if(profile){
    $("myName").textContent=profile.name;
    show("home");
    if(inviteRoom) setTimeout(()=>joinRoom(inviteRoom),500);
  }else{
    show("profile");
  }
}
function saveProfile(){
  const name=$("playerName").value.trim();
  if(!name){say("اول یک اسم وارد کن.");return;}
  profile={name,avatar:avatarChoice};
  localStorage.setItem("snakeProfile",JSON.stringify(profile));
  $("myName").textContent=name;
  show("home");
  if(inviteRoom) joinRoom(inviteRoom);
  else say("پروفایل ذخیره شد.");
}
makeAvatars();
if(profile){avatarChoice=profile.avatar||"🐍";makeAvatars();}
loadProfile();

function peerOptions(){
  return {
    host:"0.peerjs.com",
    port:443,
    path:"/",
    secure:true,
    debug:1,
    config:{
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"}
      ]
    }
  };
}
function closePeer(){
  try{if(peer)peer.destroy();}catch(e){}
  peer=null;
}
function createRoom(){
  closePeer();
  host=true;
  room=randomCode();
  myId="host";
  players=[newPlayer("host",profile,0)];
  connections={};
  say("در حال ساخت اتاق...");
  peer=new Peer("snakearena-"+room.toLowerCase(),peerOptions());
  peer.on("open",()=>{
    $("roomCode").textContent=room;
    $("hostOptions").classList.remove("hidden");
    $("roomStatus").textContent="شما میزبان و بازیکن اول هستید.";
    show("room");
    renderPlayers();
    say("اتاق ساخته شد. لینک دعوت را برای دوستانت بفرست.");
  });
  peer.on("connection",conn=>{
    conn.on("open",()=>{});
    conn.on("data",data=>hostMessage(conn,data));
    conn.on("close",()=>removeConnection(conn));
    conn.on("error",()=>say("ارتباط یکی از بازیکنان قطع شد."));
  });
  peer.on("error",err=>{
    if(err.type==="unavailable-id"){
      say("کد اتاق تکراری شد؛ در حال ساخت کد تازه...");
      closePeer();
      setTimeout(createRoom,300);
    }else{
      say("خطای ساخت اتاق: "+peerError(err.type));
    }
  });
}
function newPlayer(id,p,number){
  const spots=[[3,3],[16,3],[3,16],[16,16]];
  const s=spots[number%4];
  return {
    id,name:p.name,avatar:p.avatar||"🐍",
    x:s[0],y:s[1],dir:"right",
    body:[[s[0],s[1]],[s[0]-1,s[1]],[s[0]-2,s[1]]],
    alive:true,score:0,team:number%2
  };
}
function peerError(type){
  const messages={
    "network":"مشکل شبکه؛ اینترنت را بررسی کن.",
    "server-error":"سرور ارتباطی پاسخ نداد.",
    "socket-error":"ارتباط با سرور برقرار نشد.",
    "socket-closed":"اتصال به سرور بسته شد.",
    "peer-unavailable":"میزبان پیدا نشد؛ لینک یا کد را بررسی کن.",
    "browser-incompatible":"مرورگر از ارتباط لازم پشتیبانی نمی‌کند.",
    "disconnected":"اتصال قطع شد."
  };
  return messages[type]||type||"خطای ناشناخته";
}
function joinByCode(){
  const code=$("roomInput").value.trim().toUpperCase();
  if(code.length!==6){say("کد اتاق باید ۶ حرف یا عدد باشد.");return;}
  joinRoom(code);
}
function joinRoom(code){
  code=String(code||"").toUpperCase().trim();
  if(code.length!==6){say("کد اتاق نامعتبر است.");return;}
  if(!profile){inviteRoom=code;show("profile");say("اول پروفایلت را بساز.");return;}
  closePeer();
  host=false;room=code;myId="p-"+Math.random().toString(36).slice(2,10);
  say("در حال اتصال به اتاق "+code+" ...");
  peer=new Peer(undefined,peerOptions());
  let finished=false;
  const timeout=setTimeout(()=>{
    if(!finished){finished=true;say("اتصال زمان‌بر شد؛ میزبان آنلاین است؟");}
  },15000);
  peer.on("open",()=>{
    const conn=peer.connect("snakearena-"+code.toLowerCase(),{reliable:true});
    conn.on("open",()=>{
      if(finished)return;
      clearTimeout(timeout);finished=true;
      conn.on("data",guestMessage);
      conn.on("close",()=>say("ارتباط با میزبان قطع شد."));
      connections.host=conn;
      conn.send({type:"join",player:{id:myId,name:profile.name,avatar:profile.avatar}});
      say("به میزبان وصل شدی؛ منتظر تأیید ورود...");
    });
    conn.on("error",()=>say("اتصال به میزبان ناموفق بود."));
  });
  peer.on("error",err=>{
    clearTimeout(timeout);
    say("خطای اتصال: "+peerError(err.type));
  });
}
function hostMessage(conn,data){
  if(!data||!data.type)return;
  if(data.type==="join"){
    if(players.length>=4){conn.send({type:"full"});conn.close();return;}
    if(players.some(p=>p.id===data.player.id))return;
    const p=newPlayer(data.player.id,data.player,players.length);
    players.push(p);
    connections[p.id]=conn;
    conn.send({type:"welcome",id:p.id,room,players,host:true});
    broadcastRoom();
    say(data.player.name+" وارد اتاق شد.");
  }
  if(data.type==="dir"){
    const p=players.find(x=>x.id===data.id);
    if(p&&p.alive&&validDirection(p.dir,data.dir))p.dir=data.dir;
  }
  if(data.type==="back"){
    if(gameState){returnToRoom();}
  }
}
function guestMessage(data){
  if(!data||!data.type)return;
  if(data.type==="full"){say("ظرفیت اتاق تکمیل است.");return;}
  if(data.type==="welcome"){
    myId=data.id;room=data.room;players=data.players;
    $("roomCode").textContent=room;
    $("hostOptions").classList.add("hidden");
    show("room");renderPlayers();
    say("با موفقیت وارد اتاق شدی.");
  }
  if(data.type==="room"){
    players=data.players||[];
    $("roomStatus").textContent=data.message||"در انتظار شروع مسابقه...";
    renderPlayers();
    if(data.returned){gameState=null;show("room");}
  }
  if(data.type==="start"){
    gameState=data.state;
    endAt=data.endAt;
    show("game");drawGame();
  }
  if(data.type==="state"){
    gameState=data.state;endAt=data.endAt;
    if(!$("game").classList.contains("hidden"))drawGame();
  }
  if(data.type==="over"){
    gameState=data.state;
    $("gameTitle").textContent="مسابقه تمام شد!";
    $("gameInfo").textContent=data.message||"نتیجه مسابقه";
    drawGame();
  }
}
function sendTo(id,data){
  const c=connections[id];
  if(c&&c.open)c.send(data);
}
function broadcast(data){
  Object.values(connections).forEach(c=>{if(c&&c.open)c.send(data);});
}
function broadcastRoom(message){
  const payload={type:"room",players,message:message||"در انتظار بازیکنان..."};
  broadcast(payload);renderPlayers();
  $("roomStatus").textContent=payload.message;
}
function renderPlayers(){
  $("playerList").innerHTML="";
  players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="player";
    const team=players.length>1?(p.team===0?"تیم A":"تیم B"):"";
    d.innerHTML="<span>"+p.avatar+" "+escapeHTML(p.name)+"</span><span>"+(i===0?"👑 میزبان":"بازیکن")+" "+team+"</span>";
    $("playerList").appendChild(d);
  });
  const needed=Number($("mode").value||2);
  $("roomStatus").textContent="بازیکنان: "+players.length+" از "+needed;
  if(host)$("hostOptions").classList.remove("hidden");
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function copyInvite(){
  const link=location.origin+location.pathname+"?room="+room;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>say("لینک دعوت کپی شد.")).catch(()=>say(link));
  }else{say(link);}
}
function startGame(){
  if(!host)return;
  const needed=Number($("mode").value);
  if(players.length!==needed){
    say("برای این حالت دقیقاً "+needed+" بازیکن لازم است.");
    return;
  }
  players.forEach((p,i)=>{
    p.team=(needed===3?(i===0?0:1):i%2);
    p.alive=true;p.score=0;
    const spots=[[3,3],[16,3],[3,16],[16,16]];
    const s=spots[i];
    p.x=s[0];p.y=s[1];
    p.dir=i===0?"right":i===1?"left":i===2?"right":"left";
    p.body=[[p.x,p.y],[p.x-(p.dir==="right"?1:-1),p.y],[p.x-(p.dir==="right"?2:-2),p.y]];
  });
  gameState={players,food:randomFood(),running:true,mode:needed};
  endAt=Date.now()+Number($("duration").value)*1000;
  $("gameTitle").textContent="مسابقه شروع شد!";
  show("game");drawGame();
  broadcast({type:"start",state:gameState,endAt});
  clearInterval(tickTimer);
  tickTimer=setInterval(hostTick,160);
}
function validDirection(oldDir,newDir){
  const opposite={up:"down",down:"up",left:"right",right:"left"};
  return ["up","down","left","right"].includes(newDir)&&opposite[oldDir]!==newDir;
}
function sendDirection(dir){
  if(!gameState)return;
  if(host){
    const p=players.find(x=>x.id==="host");
    if(p&&validDirection(p.dir,dir))p.dir=dir;
  }else sendTo("host",{type:"dir",id:myId,dir});
}
document.addEventListener("keydown",e=>{
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};
  if(map[e.key]){e.preventDefault();sendDirection(map[e.key]);}
});
function randomFood(){
  return {x:Math.floor(Math.random()*26)+2,y:Math.floor(Math.random()*26)+2};
}
function movePoint(p){
  if(p.dir==="up")p.y--;
  if(p.dir==="down")p.y++;
  if(p.dir==="left")p.x--;
  if(p.dir==="right")p.x++;
}
function hostTick(){
  if(!host||!gameState||!gameState.running)return;
  const alive=players.filter(p=>p.alive);
  if(Date.now()>=endAt||alive.length<=1){
    finishGame();return;
  }
  const oldHeads=players.map(p=>p.body[0]&&[...p.body[0]]);
  players.forEach(p=>{
    if(!p.alive)return;
    movePoint(p);
    p.body.unshift([p.x,p.y]);
    if(p.x===gameState.food.x&&p.y===gameState.food.y){
      p.score+=10;gameState.food=randomFood();
    }else p.body.pop();
  });
  players.forEach(p=>{
    if(!p.alive)return;
    const hitWall=p.x<0||p.y<0||p.x>=30||p.y>=30;
    const hitSelf=p.body.slice(1).some(b=>b[0]===p.x&&b[1]===p.y);
    const hitOther=players.some(q=>q.id!==p.id&&q.body.some(b=>b[0]===p.x&&b[1]===p.y));
    const headSwap=players.some((q,i)=>q.id!==p.id&&oldHeads[i]&&oldHeads[i][0]===p.x&&oldHeads[i][1]===p.y&&q.x===oldHeads[players.indexOf(p)][0]&&q.y===oldHeads[players.indexOf(p)][1]);
    if(hitWall||hitSelf||hitOther||headSwap)p.alive=false;
  });
  gameState.players=players;
  broadcast({type:"state",state:gameState,endAt});
  drawGame();
  $("gameInfo").textContent="زمان باقی‌مانده: "+Math.max(0,Math.ceil((endAt-Date.now())/1000))+" ثانیه";
}
function finishGame(){
  clearInterval(tickTimer);
  gameState.running=false;
  const scores=players.map(p=>p.name+" ("+p.score+")").join(" | ");
  $("gameTitle").textContent="مسابقه تمام شد!";
  $("gameInfo").textContent="امتیازها: "+scores;
  broadcast({type:"over",state:gameState,message:"امتیازها: "+scores});
}
function drawGame(){
  const c=$("gameCanvas"),ctx=c.getContext("2d"),cell=16;
  ctx.fillStyle="#09111d";ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle="#17263a";
  for(let i=0;i<=30;i++){
    ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke();
  }
  if(!gameState)return;
  const f=gameState.food;
  ctx.fillStyle="#ffcc55";ctx.beginPath();ctx.arc(f.x*cell+8,f.y*cell+8,7,0,Math.PI*2);ctx.fill();
  const colors=["#38e69a","#58a9ff"];
  gameState.players.forEach(p=>{
    p.body.forEach((b,i)=>{
      ctx.fillStyle=colors[p.team||0];
      ctx.fillRect(b[0]*cell+1,b[1]*cell+1,14,14);
    });
    ctx.font="13px Arial";ctx.fillStyle="#fff";
    ctx.fillText(p.avatar,p.x*cell+1,p.y*cell-2);
  });
}
function requestBackRoom(){
  if(host){returnToRoom();}
  else{
    sendTo("host",{type:"back",id:myId});
    say("درخواست بازگشت به میزبان ارسال شد.");
  }
}
function returnToRoom(){
  if(!host)return;
  clearInterval(tickTimer);
  gameState=null;
  broadcast({type:"room",players,returned:true,message:"میزبان مسابقه را متوقف کرد؛ برگشتید به اتاق."});
  show("room");renderPlayers();
}
function removeConnection(conn){
  const id=Object.keys(connections).find(k=>connections[k]===conn);
  if(id){delete connections[id];players=players.filter(p=>p.id!==id);broadcastRoom("یک بازیکن خارج شد.");}
}
function leaveRoom(){
  clearInterval(tickTimer);
  if(host){
    broadcast({type:"room",players:[],message:"میزبان اتاق را بست."});
    closePeer();players=[];connections={};host=false;room=null;
  }else{
    const c=connections.host;
    if(c){c.close();delete connections.host;}
    closePeer();players=[];room=null;
  }
  show("home");say("از اتاق خارج شدی.");
}
</script>
</body>
</html>
