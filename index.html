
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Tahoma;text-align:center}
header{background:#1c2d43;color:#4ce5a1;padding:18px;font-size:25px;font-weight:bold}
main{max-width:600px;margin:auto;padding:12px}
.panel{background:#1c2b40;border-radius:15px;padding:15px;margin:12px 0}
input,select,button{font:inherit;border:0;border-radius:9px;padding:12px;margin:5px}
input,select{background:#0d1929;color:white;max-width:95%}
button{background:#35d69a;color:#09251b;font-weight:bold;cursor:pointer}
.secondary{background:#48617e;color:white}
.danger{background:#d94c60;color:white}
.hidden{display:none!important}
#avatars{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.avatar{font-size:25px;background:#30435e;color:white}
.avatar.selected{outline:3px solid #35d69a}
.player{background:#30435e;border-radius:9px;padding:10px;margin:5px;display:flex;justify-content:space-between}
#status{color:#ffd66c;min-height:25px;font-size:13px}
canvas{width:100%;max-width:480px;background:#08121e;border:3px solid #49627f;border-radius:10px;touch-action:none}
#joystick{width:150px;height:150px;border-radius:50%;background:#30435e;border:3px solid #5b7899;margin:15px auto;position:relative;touch-action:none}
#stick{width:58px;height:58px;border-radius:50%;background:#35d69a;border:3px solid white;position:absolute;left:43px;top:43px;pointer-events:none}
#controls{display:grid;grid-template-columns:65px 65px 65px;justify-content:center;gap:6px}
#controls button{font-size:22px}
</style>
</head>
<body>
<header>🐍 SNAKE ARENA</header>
<main>

<section id="profile" class="panel">
<h3>پروفایل بازیکن</h3>
<input id="name" maxlength="16" placeholder="نام بازیکن">
<div>آواتار خود را انتخاب کن</div>
<div id="avatars"></div>
<button onclick="saveProfile()">ذخیره پروفایل</button>
</section>

<section id="home" class="panel hidden">
<h3>سلام <span id="welcome"></span> 👋</h3>
<button onclick="startSolo()">🎮 بازی با ربات</button>
<hr>
<button onclick="createRoom()">🌐 ساخت اتاق آنلاین</button>
<div>
<input id="codeInput" maxlength="6" placeholder="کد اتاق">
<button onclick="joinRoom()">پیوستن به اتاق</button>
</div>
</section>

<section id="room" class="panel hidden">
<h3>اتاق بازی</h3>
<p>کد اتاق: <b id="codeText"></b></p>
<button class="secondary" onclick="copyLink()">کپی لینک دعوت</button>
<p id="roomInfo">در انتظار بازیکنان...</p>
<h4>بازیکنان</h4>
<div id="players"></div>
<div id="hostSettings" class="hidden">
<select id="mode">
<option value="2">۱ به ۱</option>
<option value="3">۱ به ۲</option>
<option value="4">۲ به ۲</option>
</select>
<select id="time">
<option value="60">۱ دقیقه</option>
<option value="120">۲ دقیقه</option>
<option value="180">۳ دقیقه</option>
</select>
<button onclick="startOnline()">شروع مسابقه</button>
</div>
<button class="danger" onclick="exitRoom()">خروج</button>
</section>

<section id="game" class="panel hidden">
<h3 id="gameTitle">مسابقه شروع شد</h3>
<p id="gameInfo"></p>
<canvas id="board" width="480" height="480"></canvas>
<h4>🕹️ جوی‌استیک حرکت</h4>
<div id="joystick"><div id="stick"></div></div>
<div id="controls">
<span></span><button onclick="move('up')">⬆️</button><span></span>
<button onclick="move('left')">⬅️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('right')">➡️</button>
</div>
<button onclick="restartGame()">🔄 شروع دوباره</button>
<button class="secondary" onclick="backToRoom()">بازگشت به اتاق</button>
</section>
<div id="status"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const icons=["🐍","🐲","🦊","🐼","🐯","🦁","🐸","🐵","🐺","🐻","🦄","🐙"];
let avatar="🐍";
let profile=JSON.parse(localStorage.getItem("snakeProfile")||"null");
let peer=null,host=false,roomCode="",myId="";
let players=[],connections={},game=null,timer=null;
let online=false,gameEnd=0,botMode=false;

function status(t){$("status").textContent=t}
function screen(id){
 ["profile","home","room","game"].forEach(x=>$(x).classList.add("hidden"));
 $(id).classList.remove("hidden");
}
function setupAvatars(){
 $("avatars").innerHTML="";
 icons.forEach(a=>{
  let b=document.createElement("button");
  b.className="avatar"+(a===avatar?" selected":"");
  b.textContent=a;
  b.onclick=()=>{
   avatar=a;
   document.querySelectorAll(".avatar").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
  };
  $("avatars").appendChild(b);
 });
}
function saveProfile(){
 let n=$("name").value.trim();
 if(!n){status("نام را وارد کن");return}
 profile={name:n,avatar};
 localStorage.setItem("snakeProfile",JSON.stringify(profile));
 $("welcome").textContent=n;
 screen("home");
 if(inviteCode)connectRoom(inviteCode);
}
function showProfile(){
 if(profile){
  avatar=profile.avatar||"🐍";
  $("welcome").textContent=profile.name;
  screen("home");
  if(inviteCode)connectRoom(inviteCode);
 }else screen("profile");
}
setupAvatars();
let inviteCode=new URLSearchParams(location.search).get("room");
showProfile();

function randomCode(){
 let chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";
 let bytes=new Uint8Array(6);crypto.getRandomValues(bytes);
 for(let b of bytes)s+=chars[b%chars.length];
 return s;
}
function newPeer(){
 return new Peer(undefined,{
  host:"0.peerjs.com",port:443,path:"/",secure:true,
  config:{iceServers:[
   {urls:"stun:stun.l.google.com:19302"},
   {urls:"stun:stun1.l.google.com:19302"}
  ]}
 });
}
function closePeer(){
 try{if(peer)peer.destroy()}catch(e){}
 peer=null;
}
function createRoom(){
 if(!profile)return;
 closePeer();host=true;online=true;botMode=false;
 roomCode=randomCode();myId="host";
 players=[makePlayer("host",profile,0)];
 connections={};
 status("در حال ساخت اتاق...");
 peer=new Peer("snakearena-"+roomCode.toLowerCase(),{
  host:"0.peerjs.com",port:443,path:"/",secure:true,
  config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}
 });
 let finished=false;
 let timeout=setTimeout(()=>{
  if(!finished){finished=true;status("سرور پاسخ نداد. اینترنت را بررسی کن.")}
 },12000);
 peer.on("open",()=>{
  finished=true;clearTimeout(timeout);
  $("codeText").textContent=roomCode;
  $("hostSettings").classList.remove("hidden");
  screen("room");renderPlayers();
  status("اتاق ساخته شد؛ لینک دعوت را بفرست.");
 });
 peer.on("connection",c=>{
  c.on("data",d=>hostMessage(c,d));
  c.on("close",()=>removePlayer(c));
 });
 peer.on("error",e=>{
  clearTimeout(timeout);
  status("خطای ساخت اتاق: "+e.type);
 });
}
function makePlayer(id,p,i){
 let spots=[[4,4],[25,4],[4,25],[25,25]],s=spots[i%4];
 return {
  id,name:p.name,avatar:p.avatar||"🐍",
  x:s[0],y:s[1],dir:i%2?"left":"right",
  body:[[s[0],s[1]],[s[0]-1,s[1]],[s[0]-2,s[1]]],
  alive:true,score:0,team:i%2
 };
}
function joinRoom(){
 let c=$("codeInput").value.trim().toUpperCase();
 if(c.length!==6){status("کد باید ۶ کاراکتر باشد");return}
 connectRoom(c);
}
function connectRoom(c){
 if(!profile){inviteCode=c;screen("profile");return}
 closePeer();host=false;online=true;roomCode=c;
 myId="guest-"+Math.random().toString(36).slice(2,10);
 status("در حال اتصال به میزبان...");
 peer=newPeer();
 let timerConnect=setTimeout(()=>status("اتصال برقرار نشد؛ میزبان آنلاین است؟"),15000);
 peer.on("open",()=>{
  let conn=peer.connect("snakearena-"+c.toLowerCase(),{reliable:true});
  conn.on("open",()=>{
   clearTimeout(timerConnect);
   connections.host=conn;
   conn.on("data",guestMessage);
   conn.on("close",()=>status("اتصال میزبان قطع شد"));
   conn.send({type:"join",id:myId,profile});
   status("وصل شدی؛ منتظر تأیید میزبان...");
  });
  conn.on("error",()=>status("خطا در اتصال به میزبان"));
 });
 peer.on("error",e=>{
  clearTimeout(timerConnect);
  status("خطای اتصال: "+e.type);
 });
}
function hostMessage(c,d){
 if(!d)return;
 if(d.type==="join"){
  if(players.length>=4){c.send({type:"full"});c.close();return}
  if(players.some(p=>p.id===d.id))return;
  let p=makePlayer(d.id,d.profile,players.length);
  players.push(p);connections[d.id]=c;
  c.send({type:"welcome",id:d.id,players});
  broadcastRoom();
 }
 if(d.type==="direction"){
  let p=players.find(x=>x.id===d.id);
  if(p&&p.alive&&validDir(p.dir,d.dir))p.dir=d.dir;
 }
 if(d.type==="back")returnToRoom();
 if(d.type==="restart"&&game&&!game.running)startOnline();
}
function guestMessage(d){
 if(!d)return;
 if(d.type==="full"){status("اتاق پر است");return}
 if(d.type==="welcome"){
  myId=d.id;players=d.players;
  $("codeText").textContent=roomCode;
  $("hostSettings").classList.add("hidden");
  screen("room");renderPlayers();
  status("وارد اتاق شدی");
 }
 if(d.type==="room"){
  players=d.players||[];renderPlayers();
  if(d.returned)screen("room");
  $("roomInfo").textContent=d.message||"در انتظار...";
 }
 if(d.type==="start"){
  game=d.game;gameEnd=d.end;
  screen("game");draw();
 }
 if(d.type==="state"){
  game=d.game;gameEnd=d.end;draw();updateInfo();
 }
 if(d.type==="finish"){
  game=d.game;draw();
  $("gameTitle").textContent="🏆 مسابقه تمام شد";
  $("gameInfo").textContent=d.winner;
 }
}
function broadcast(d){
 Object.values(connections).forEach(c=>{if(c&&c.open)c.send(d)});
}
function broadcastRoom(message){
 broadcast({type:"room",players,message});
 renderPlayers();
}
function renderPlayers(){
 $("players").innerHTML="";
 players.forEach((p,i)=>{
  let d=document.createElement("div");d.className="player";
  d.textContent=p.avatar+" "+p.name+" — "+(i===0?"👑 میزبان":"بازیکن");
  $("players").appendChild(d);
 });
 $("roomInfo").textContent="تعداد بازیکنان: "+players.length;
}
function copyLink(){
 let link=location.origin+location.pathname+"?room="+roomCode;
 if(navigator.clipboard){
  navigator.clipboard.writeText(link).then(()=>status("لینک کپی شد")).catch(()=>status(link));
 }else status(link);
}
function validDir(a,b){
 let opposite={up:"down",down:"up",left:"right",right:"left"};
 return ["up","down","left","right"].includes(b)&&opposite[a]!==b;
}
function move(d){
 if(!game)return;
 if(botMode){
  let p=game.players[0];
  if(p&&validDir(p.dir,d))p.dir=d;
 }else if(host){
  let p=players.find(x=>x.id==="host");
  if(p&&validDir(p.dir,d))p.dir=d;
 }else{
  let c=connections.host;
  if(c&&c.open)c.send({type:"direction",id:myId,dir:d});
 }
}
document.addEventListener("keydown",e=>{
 let m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
 if(m[e.key]){e.preventDefault();move(m[e.key])}
});
function food(){
 return {x:Math.floor(Math.random()*26)+2,y:Math.floor(Math.random()*26)+2};
}
function startSolo(){
 closePeer();host=false;online=false;botMode=true;
 players=[
  makePlayer("you",profile,0),
  makePlayer("bot",{name:"ربات",avatar:"🤖"},1)
 ];
 game={players,food:food(),running:true};
 gameEnd=Date.now()+180000;
 screen("game");
 $("gameTitle").textContent="بازی با ربات 🤖";
 $("gameInfo").textContent="آخرین مار زنده برنده است.";
 draw();
 clearInterval(timer);timer=setInterval(soloTick,180);
}
function startOnline(){
 if(!host)return;
 let n=Number($("mode").value);
 if(players.length!==n){status("تعداد بازیکنان برای این حالت کافی نیست");return}
 players.forEach((p,i)=>{
  p.team=n===3?(i===0?0:1):i%2;
  p.alive=true;p.score=0;
  let s=[[4,4],[25,4],[4,25],[25,25]][i];
  p.x=s[0];p.y=s[1];p.dir=i%2?"left":"right";
  p.body=[[p.x,p.y],[p.x-1,p.y],[p.x-2,p.y]];
 });
 game={players,food:food(),running:true};
 gameEnd=Date.now()+Number($("time").value)*1000;
 screen("game");draw();
 broadcast({type:"start",game,end:gameEnd});
 clearInterval(timer);timer=setInterval(hostTick,180);
}
function botThink(bot,target){
 let choices=["up","down","left","right"].filter(d=>validDir(bot.dir,d));
 let safe=choices.filter(d=>{
  let x=bot.x+(d==="right"?1:d==="left"?-1:0);
  let y=bot.y+(d==="down"?1:d==="up"?-1:0);
  return x>0&&x<29&&y>0&&y<29&&
   !bot.body.some(b=>b[0]===x&&b[1]===y);
 });
 if(!safe.length)return;
 let preferred=Math.abs(target.x-bot.x)>Math.abs(target.y-bot.y)?
  (target.x>bot.x?"right":"left"):(target.y>bot.y?"down":"up");
 bot.dir=safe.includes(preferred)?preferred:safe[Math.floor(Math.random()*safe.length)];
}
function step(){
 game.players.forEach(p=>{
  if(!p.alive)return;
  if(botMode&&p.id==="bot")botThink(p,game.food);
  if(p.dir==="up")p.y--;
  if(p.dir==="down")p.y++;
  if(p.dir==="left")p.x--;
  if(p.dir==="right")p.x++;
  p.body.unshift([p.x,p.y]);
  if(p.x===game.food.x&&p.y===game.food.y){
   p.score+=10;game.food=food();
  }else p.body.pop();
 });
 game.players.forEach(p=>{
  if(!p.alive)return;
  let hit=p.x<0||p.y<0||p.x>=30||p.y>=30;
  hit=hit||p.body.slice(1).some(b=>b[0]===p.x&&b[1]===p.y);
  hit=hit||game.players.some(q=>q!==p&&q.body.some(b=>b[0]===p.x&&b[1]===p.y));
  if(hit)p.alive=false;
 });
}
function soloTick(){
 if(!game||!game.running)return;
 step();draw();
 let alive=game.players.filter(p=>p.alive);
 if(alive.length<=1||Date.now()>=gameEnd){
  game.running=false;clearInterval(timer);
  let winner=alive[0];
  $("gameTitle").textContent=winner?"🏆 "+winner.name+" برنده شد!":"🏆 مساوی!";
  $("gameInfo").textContent="امتیاز تو: "+game.players[0].score+" | امتیاز ربات: "+game.players[1].score;
 }
}
function hostTick(){
 if(!game||!game.running)return;
 step();draw();
 broadcast({type:"state",game,end:gameEnd});
 let alive=game.players.filter(p=>p.alive);
 if(alive.length<=1||Date.now()>=gameEnd){
  game.running=false;clearInterval(timer);
  let winner=alive[0];
  let msg=winner?winner.name+" برنده شد!":"مساوی!";
  $("gameTitle").textContent="🏆 مسابقه تمام شد";
  $("gameInfo").textContent=msg;
  broadcast({type:"finish",game,winner:msg});
 }
 updateInfo();
}
function updateInfo(){
 if(!game)return;
 $("gameInfo").textContent="زنده: "+game.players.filter(p=>p.alive).length+" | زمان: "+Math.max(0,Math.ceil((gameEnd-Date.now())/1000))+" ثانیه";
}
function draw(){
 let c=$("board"),ctx=c.getContext("2d"),s=16;
 ctx.fillStyle="#08121e";ctx.fillRect(0,0,480,480);
 ctx.strokeStyle="#14263a";
 for(let i=0;i<=30;i++){
  ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,480);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i*s);ctx.lineTo(480,i*s);ctx.stroke();
 }
 if(!game)return;
 ctx.fillStyle="#ffce54";
 ctx.beginPath();ctx.arc(game.food.x*s+8,game.food.y*s+8,7,0,7);ctx.fill();
 game.players.forEach(p=>{
  p.body.forEach(b=>{
   ctx.fillStyle=p.alive?(p.team===0?"#38df9a":"#55a7ff"):"#555";
   ctx.fillRect(b[0]*s+1,b[1]*s+1,14,14);
  });
  if(p.alive){ctx.font="13px Arial";ctx.fillStyle="white";ctx.fillText(p.avatar,p.x*s,p.y*s);}
 });
}
function restartGame(){
 if(botMode){startSolo();return}
 if(host){startOnline();return}
 let c=connections.host;
 if(c&&c.open){
  c.send({type:"restart"});
  status("درخواست شروع دوباره ارسال شد");
 }else status("اتصال به میزبان برقرار نیست");
}
function backToRoom(){
 if(botMode){
  clearInterval(timer);game=null;screen("home");return;
 }
 if(host)returnToRoom();
 else{
  let c=connections.host;
  if(c&&c.open)c.send({type:"back"});
  status("درخواست بازگشت ارسال شد");
 }
}
function returnToRoom(){
 if(!host)return;
 clearInterval(timer);game=null;
 broadcast({type:"room",players,returned:true,message:"به اتاق برگشتید"});
 screen("room");renderPlayers();
}
function removePlayer(c){
 let id=Object.keys(connections).find(k=>connections[k]===c);
 if(!id)return;
 delete connections[id];
 players=players.filter(p=>p.id!==id);
 broadcastRoom("یک بازیکن خارج شد");
}
function exitRoom(){
 clearInterval(timer);
 if(host)broadcast({type:"room",players:[],message:"میزبان اتاق را بست"});
 else if(connections.host)connections.host.close();
 closePeer();players=[];connections={};game=null;host=false;
 screen("home");status("از اتاق خارج شدی");
}

// Joystick: drag in any direction to steer
(function(){
 const joy=$("joystick"),stick=$("stick");
 let active=false;
 function reset(){
  stick.style.left="43px";stick.style.top="43px";
 }
 function handle(e){
  if(!active)return;
  const r=joy.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);
  const max=42,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  stick.style.left=(43+dx)+"px";
  stick.style.top=(43+dy)+"px";
  if(Math.hypot(dx,dy)<12)return;
  move(Math.abs(dx)>Math.abs(dy)?
   (dx>0?"right":"left"):(dy>0?"down":"up"));
 }
 joy.addEventListener("pointerdown",e=>{
  active=true;joy.setPointerCapture(e.pointerId);handle(e);
 });
 joy.addEventListener("pointermove",handle);
 joy.addEventListener("pointerup",()=>{active=false;reset()});
 joy.addEventListener("pointercancel",()=>{active=false;reset()});
})();
</script>
</body>
</html>
