
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:white;font-family:Arial,Tahoma,sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;background:#16a36a;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45}
.screen{display:none;min-height:100dvh;padding:18px;overflow:auto}
.screen.active{display:flex;flex-direction:column;align-items:center}
h1{color:#35e69b;margin:20px 0 5px}
h2{margin:8px 0}
.sub{color:#aab8ca;margin:5px 0 20px}
.panel{width:min(100%,460px);background:#142238;border:1px solid #263d5c;border-radius:18px;padding:17px;margin:9px 0}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #40536d;background:#0b1728;color:white;margin:7px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{width:100%;margin-top:8px}
.secondary{background:#30445e}
.danger{background:#bd394d}
.small{font-size:12px;color:#a9b7c9}
.player{display:flex;align-items:center;gap:10px;padding:9px;background:#0c192a;border-radius:10px;margin:6px 0}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#284b65;font-size:20px}
#gameScreen{padding:0;position:relative;overflow:hidden;min-height:100dvh;background:#07101c}
#gameTop{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.stat{background:#102139dd;border:1px solid #36516b;border-radius:10px;padding:8px;font-size:12px}
#gameCanvas{width:100vw;height:100dvh;display:block;touch-action:none}
#joystick{position:absolute;bottom:28px;left:25px;width:145px;height:145px;border-radius:50%;background:#ffffff20;border:3px solid #ffffff55;z-index:5;touch-action:none;display:grid;place-items:center}
#knob{width:60px;height:60px;border-radius:50%;background:#35e69b;border:3px solid #d5fff0;box-shadow:0 3px 15px #0008;pointer-events:none}
#gameButtons{position:absolute;bottom:20px;right:14px;z-index:5;display:flex;flex-direction:column;gap:8px}
#gameButtons button{background:#142b43dd;border:1px solid #49627c;padding:10px;font-size:12px}
#gameOver{display:none;position:absolute;inset:0;background:#06101ddd;z-index:8;align-items:center;justify-content:center;padding:20px}
#gameOver .panel{text-align:center}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#152b43;padding:10px 15px;border-radius:10px;display:none}
#profileModal{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:18px}
#profileModal .panel{max-width:400px}
</style>
</head>
<body>

<div id="toast"></div>

<section id="home" class="screen active">
<h1>🐍 SNAKE ARENA</h1>
<div class="sub">بازی آنلاین مارها</div>

<div class="panel">
<h2>👤 پروفایل بازیکن</h2>
<div id="profileInfo">در حال بارگذاری...</div>
<button class="secondary full" onclick="editProfile()">ویرایش پروفایل</button>
</div>

<div class="panel">
<h2>🎮 شروع بازی</h2>
<button class="full" onclick="startSolo()">بازی تک‌نفره با ربات</button>
<button class="full" onclick="createRoom()">ساخت اتاق آنلاین</button>
<input id="roomInput" placeholder="کد اتاق یا لینک دعوت">
<button class="secondary full" onclick="joinRoom()">پیوستن به اتاق</button>
</div>

<div class="panel">
<h2>🏆 رکوردها</h2>
<div id="records"></div>
</div>
</section>

<section id="lobby" class="screen">
<h1>🏠 اتاق بازی</h1>
<div class="panel">
<div>کد اتاق: <b id="roomCode">---</b></div>
<button class="secondary full" onclick="copyInvite()">📨 کپی لینک دعوت</button>
<div class="small" id="roomStatus">در انتظار بازیکنان...</div>
</div>
<div class="panel">
<h2>👥 بازیکنان</h2>
<div id="playersList"></div>
</div>
<div class="panel" id="hostOptions">
<h2>⚙️ تنظیمات مسابقه</h2>
<label>حالت بازی</label>
<select id="modeSelect" onchange="updateLobby()">
<option value="2">۱ به ۱ (۲ بازیکن)</option>
<option value="3">۱ به ۲ (۳ بازیکن)</option>
<option value="4">۲ به ۲ (۴ بازیکن)</option>
</select>
<label>مدت مسابقه</label>
<select id="durationSelect">
<option value="60">۱ دقیقه</option>
<option value="120">۲ دقیقه</option>
<option value="180">۳ دقیقه</option>
<option value="300">۵ دقیقه</option>
</select>
<button class="full" id="startButton" onclick="startOnline()">شروع مسابقه</button>
</div>
<div class="panel" id="guestMessage" style="display:none">
در انتظار شروع مسابقه توسط سازنده اتاق...
</div>
<button class="danger full" onclick="leaveRoom()">خروج از اتاق</button>
</section>

<section id="gameScreen" class="screen">
<div id="gameTop">
<div class="stat">⏱ <span id="timer">0</span></div>
<div class="stat">🏆 <span id="score">0</span></div>
<div class="stat">👥 <span id="alive">0</span></div>
</div>
<canvas id="gameCanvas"></canvas>

<div id="joystick">
<div id="knob"></div>
</div>

<div id="gameButtons">
<button onclick="restartGame()">🔄 شروع مجدد</button>
<button onclick="backToRoom()">🏠 بازگشت به اتاق</button>
</div>

<div id="gameOver">
<div class="panel">
<h2>🏁 مسابقه تمام شد!</h2>
<div id="winnerText"></div>
<button class="full" onclick="restartGame()">بازی دوباره</button>
<button class="secondary full" onclick="backToRoom()">بازگشت به اتاق</button>
</div>
</div>
</section>

<div id="profileModal">
<div class="panel">
<h2>ساخت پروفایل</h2>
<input id="nameInput" maxlength="16" placeholder="اسم بازیکن">
<select id="genderInput">
<option value="👦">پسر</option>
<option value="👧">دختر</option>
<option value="🙂">ترجیح می‌دهم نگویم</option>
</select>
<button class="full" onclick="saveProfile()">ذخیره پروفایل</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const STORAGE="snakeArenaProfileV3";
let profile=JSON.parse(localStorage.getItem(STORAGE)||"null");
let peer=null,conn=null,connections=new Map();
let roomId="",isHost=false,players=[],game=null;
let gameTimer=null,renderTimer=null,secondsLeft=0;
let lastSavedScore=0,joystickPointer=null;
const canvas=$("gameCanvas"),ctx=canvas.getContext("2d");
const W=30,H=19,CELL=20;
const COLORS=["#36e69b","#ffcb55","#61a9ff","#ff6b88"];

function toast(s){
 $("toast").textContent=s;$("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",2200);
}
function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");
}
function profileSetup(){
 if(!profile){$("profileModal").style.display="flex";return false}
 return true;
}
function editProfile(){
 $("nameInput").value=profile?.name||"";
 $("genderInput").value=profile?.avatar||"👦";
 $("profileModal").style.display="flex";
}
function saveProfile(){
 const name=$("nameInput").value.trim();
 if(name.length<2){toast("اسم باید حداقل ۲ حرف باشد");return}
 profile=profile||{total:0,best:0};
 profile.name=name;profile.avatar=$("genderInput").value;
 profile.total=profile.total||0;profile.best=profile.best||0;
 localStorage.setItem(STORAGE,JSON.stringify(profile));
 $("profileModal").style.display="none";
 refreshProfile();
}
function refreshProfile(){
 if(!profile)return;
 $("profileInfo").innerHTML=`<div class="player"><div class="avatar">${profile.avatar}</div><b>${escapeHTML(profile.name)}</b></div>
 <div>امتیاز کل: ${profile.total||0}</div><div>بهترین رکورد: ${profile.best||0}</div>`;
 $("records").textContent=`امتیاز کل: ${profile.total||0} | رکورد: ${profile.best||0}`;
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function savePoints(value){
 if(!profile)return;
 const diff=Math.max(0,value-lastSavedScore);
 if(diff>0){
  profile.total=(profile.total||0)+diff;
  profile.best=Math.max(profile.best||0,value);
  localStorage.setItem(STORAGE,JSON.stringify(profile));
  refreshProfile();
 }
 lastSavedScore=value;
}
function resetPointTracking(){lastSavedScore=0}

function randomCode(){
 return "sa"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
}
function connectPeer(id){
 return new Promise((resolve,reject)=>{
  peer=new Peer(id||undefined);
  peer.on("open",resolve);
  peer.on("error",e=>{toast("خطای اتصال: "+e.type);reject(e)});
  peer.on("connection",c=>{if(isHost)hostConnection(c)});
 });
}
async function createRoom(){
 if(!profileSetup())return;
 if(typeof Peer==="undefined"){toast("اتصال اینترنت یا PeerJS مشکل دارد");return}
 isHost=true;roomId=randomCode();
 try{
  await connectPeer(roomId);
  players=[makePlayer(peer.id,profile.name,profile.avatar,0)];
  connections.clear();
  $("roomCode").textContent=roomId;
  $("hostOptions").style.display="block";
  $("guestMessage").style.display="none";
  show("lobby");updateLobby();
  toast("اتاق ساخته شد!");
 }catch(e){isHost=false}
}
function makePlayer(id,name,avatar,index){
 const spots=[[4,9],[25,9],[4,15],[25,15]];
 const p=spots[index%4];
 return {id,name,avatar,color:COLORS[index%4],x:p[0],y:p[1],
  dir:{x:index%2===0?1:-1,y:0},snake:[],score:0,alive:true};
}
function hostConnection(c){
 connections.set(c.peer,c);
 c.on("data",d=>{
  if(d.type==="join"){
   if(players.length>=Number($("modeSelect").value)||players.length>=4){
    c.send({type:"full"});c.close();return;
   }
   if(players.some(p=>p.id===c.peer))return;
   players.push(makePlayer(c.peer,d.name,d.avatar,players.length));
   broadcast({type:"lobby",players,mode:$("modeSelect").value});
   updateLobby();
  }
  if(d.type==="dir"){
   const p=players.find(x=>x.id===c.peer);
   if(p&&p.alive&&validDirection(p.dir,d.dir))p.dir=d.dir;
  }
  if(d.type==="restart")startOnline();
  if(d.type==="leave"){
   players=players.filter(p=>p.id!==c.peer);
   connections.delete(c.peer);updateLobby();
   broadcast({type:"lobby",players});
  }
 });
 c.on("close",()=>{
  connections.delete(c.peer);
  players=players.filter(p=>p.id!==c.peer);
  updateLobby();broadcast({type:"lobby",players});
 });
}
function validDirection(old,d){
 return d&&Number.isFinite(d.x)&&Number.isFinite(d.y)&&
  !(old.x===-d.x&&old.y===-d.y);
}
function broadcast(data){
 connections.forEach(c=>{if(c.open)c.send(data)});
}
function updateLobby(){
 $("playersList").innerHTML="";
 players.forEach(p=>{
  const d=document.createElement("div");d.className="player";
  d.innerHTML=`<div class="avatar">${escapeHTML(p.avatar)}</div><b>${escapeHTML(p.name)}</b>${p.id===peer?.id?" (میزبان)":""}`;
  $("playersList").appendChild(d);
 });
 const needed=Number($("modeSelect").value||2);
 $("roomStatus").textContent=`${players.length} از ${needed} بازیکن`;
 $("startButton").disabled=!isHost||players.length!==needed;
}
async function joinRoom(){
 if(!profileSetup())return;
 if(typeof Peer==="undefined"){toast("PeerJS بارگذاری نشده");return}
 let value=$("roomInput").value.trim();
 const match=value.match(/[?&]room=([^&]+)/);
 if(match)value=decodeURIComponent(match[1]);
 if(!value){toast("کد اتاق یا لینک دعوت را وارد کن");return}
 roomId=value;isHost=false;
 try{
  await connectPeer();
  conn=peer.connect(roomId,{reliable:true});
  conn.on("open",()=>{
   conn.send({type:"join",name:profile.name,avatar:profile.avatar});
   $("roomCode").textContent=roomId;
   $("hostOptions").style.display="none";
   $("guestMessage").style.display="block";
   show("lobby");toast("به اتاق وصل شدی!");
  });
  conn.on("data",handleGuestData);
  conn.on("close",()=>toast("اتصال به میزبان قطع شد"));
 }catch(e){toast("پیوستن به اتاق انجام نشد")}
}
function handleGuestData(d){
 if(d.type==="full"){toast("ظرفیت اتاق تکمیل است");return}
 if(d.type==="lobby"){
  players=d.players||[];
  $("roomStatus").textContent=`${players.length} بازیکن در اتاق`;
  $("playersList").innerHTML="";
  players.forEach(p=>{
   const el=document.createElement("div");el.className="player";
   el.innerHTML=`<div class="avatar">${escapeHTML(p.avatar)}</div><b>${escapeHTML(p.name)}</b>`;
   $("playersList").appendChild(el);
  });
 }
 if(d.type==="start"){
  game=d.game;secondsLeft=d.duration;
  resetPointTracking();show("gameScreen");startRendering();
 }
 if(d.type==="state"){
  game=d.game;secondsLeft=d.time;
  const me=game.players.find(p=>p.id===peer.id);
  if(me)savePoints(me.score);
  if(game.over)showGameOver();
 }
 if(d.type==="end"){game=d.game;showGameOver()}
}
function copyInvite(){
 const url=location.origin+location.pathname+"?room="+encodeURIComponent(roomId);
 if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast("لینک دعوت کپی شد"));
 else toast(url);
}
function leaveRoom(){
 stopLoops();
 if(isHost){broadcast({type:"end",game});if(peer)peer.destroy()}
 else{
  if(conn&&conn.open)conn.send({type:"leave"});
  if(peer)peer.destroy();
 }
 peer=null;conn=null;connections.clear();players=[];roomId="";isHost=false;
 show("home");
}
function backToRoom(){
 stopLoops();
 $("gameOver").style.display="none";
 show("lobby");
}
function startSolo(){
 if(!profileSetup())return;
 isHost=true;roomId="";
 players=[makePlayer("solo",profile.name,profile.avatar,0)];
 players.push(makePlayer("bot1","ربات ۱","🤖",1));
 players.push(makePlayer("bot2","ربات ۲","🤖",2));
 startGame(120);
}
function startOnline(){
 if(!isHost)return;
 const needed=Number($("modeSelect").value);
 if(players.length!==needed){toast("تعداد بازیکنان کامل نیست");return}
 startGame(Number($("durationSelect").value));
}
function startGame(duration){
 secondsLeft=duration;
 resetPointTracking();
 players.forEach((p,i)=>{
  p.score=0;p.alive=true;
  const spots=[[4,9],[25,9],[4,15],[25,15]];
  p.x=spots[i][0];p.y=spots[i][1];
  p.dir={x:i%2===0?1:-1,y:0};
  p.snake=[{x:p.x,y:p.y},{x:p.x-p.dir.x,y:p.y},{x:p.x-2*p.dir.x,y:p.y}];
 });
 game={players,food:randomFood(),over:false,tick:0};
 show("gameScreen");$("gameOver").style.display="none";
 if(isHost){
  broadcast({type:"start",game,duration});
  stopLoops();
  gameTimer=setInterval(hostTick,140);
 }
 startRendering();
}
function randomFood(){
 let f;
 do{f={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}
 while(game?.players?.some(p=>p.snake?.some(s=>s.x===f.x&&s.y===f.y)));
 return f;
}
function hostTick(){
 if(!game||game.over)return;
 game.tick++;
 game.players.forEach(p=>{
  if(!p.alive)return;
  if(p.id==="solo"||p.id==="bot1"||p.id==="bot2")botThink(p);
  p.x+=p.dir.x;p.y+=p.dir.y;
  const head={x:p.x,y:p.y};
  const hitWall=p.x<0||p.y<0||p.x>=W||p.y>=H;
  const hitBody=p.snake.some(s=>s.x===p.x&&s.y===p.y);
  const hitOther=game.players.some(q=>q!==p&&q.alive&&q.snake.some(s=>s.x===p.x&&s.y===p.y));
  if(hitWall||hitBody||hitOther){p.alive=false;return}
  p.snake.unshift(head);p.snake.pop();
  if(p.x===game.food.x&&p.y===game.food.y){
   p.snake.push({...p.snake[p.snake.length-1]});
   p.score+=10;game.food=randomFood();
  }
  if(game.tick%7===0)p.score+=1;
 });
 if(game.tick%7===0)secondsLeft=Math.max(0,secondsLeft-1);
 const alive=game.players.filter(p=>p.alive).length;
 if(alive<=1||secondsLeft<=0){
  game.over=true;broadcast({type:"end",game});showGameOver();return;
 }
 if(game.tick%2===0)broadcast({type:"state",game,time:secondsLeft});
 const me=game.players.find(p=>p.id===peer?.id||p.id==="solo");
 if(me)savePoints(me.score);
}
function botThink(p){
 if(Math.random()>.16)return;
 const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
 .filter(d=>validDirection(p.dir,d));
 const safe=dirs.filter(d=>{
  const x=p.x+d.x,y=p.y+d.y;
  return x>=1&&y>=1&&x<W-1&&y<H-1&&
   !game.players.some(q=>q.snake.some(s=>s.x===x&&s.y===y));
 });
 if(safe.length)p.dir=safe[Math.floor(Math.random()*safe.length)];
}
function restartGame(){
 if(isHost){
  if(roomId)startOnline();else startSolo();
 }else if(conn&&conn.open)conn.send({type:"restart"});
}
function showGameOver(){
 stopLoops();$("gameOver").style.display="flex";
 const alive=game?.players?.filter(p=>p.alive)||[];
 const winner=alive.sort((a,b)=>b.score-a.score)[0];
 $("winnerText").textContent=winner?`برنده: ${winner.name} — امتیاز ${winner.score}`:"مسابقه تمام شد!";
}
function stopLoops(){
 if(gameTimer)clearInterval(gameTimer);
 if(renderTimer)clearInterval(renderTimer);
 gameTimer=null;renderTimer=null;
}
function startRendering(){
 if(renderTimer)clearInterval(renderTimer);
 resizeCanvas();renderTimer=setInterval(drawGame,70);drawGame();
}
function resizeCanvas(){
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resizeCanvas);
function drawGame(){
 if(!game)return;
 const cw=innerWidth,ch=innerHeight;
 const cell=Math.min(cw/W,ch/H);
 const ox=(cw-cell*W)/2,oy=(ch-cell*H)/2;
 ctx.fillStyle="#07101c";ctx.fillRect(0,0,cw,ch);
 ctx.fillStyle="#10243a";ctx.fillRect(ox,oy,cell*W,cell*H);
 ctx.strokeStyle="#19334b";ctx.lineWidth=.5;
 for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(ox+x*cell,oy);ctx.lineTo(ox+x*cell,oy+H*cell);ctx.stroke()}
 for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(ox,oy+y*cell);ctx.lineTo(ox+W*cell,oy+y*cell);ctx.stroke()}
 if(game.food){
  ctx.fillStyle="#ffcf4a";ctx.beginPath();
  ctx.arc(ox+(game.food.x+.5)*cell,oy+(game.food.y+.5)*cell,cell*.36,0,Math.PI*2);ctx.fill();
 }
 game.players.forEach(p=>{
  p.snake.forEach((s,i)=>{
   ctx.fillStyle=p.alive?p.color:"#536171";
   ctx.beginPath();ctx.roundRect(ox+s.x*cell+1,oy+s.y*cell+1,cell-2,cell-2,cell*.25);ctx.fill();
  });
  if(p.snake.length){
   ctx.fillStyle="white";ctx.font="12px Arial";ctx.textAlign="center";
   ctx.fillText(p.name,ox+(p.x+.5)*cell,oy+(p.y-.2)*cell);
  }
 });
 $("timer").textContent=secondsLeft;
 const me=game.players.find(p=>p.id===peer?.id||p.id==="solo");
 $("score").textContent=me?.score||0;
 $("alive").textContent=game.players.filter(p=>p.alive).length;
}
function sendDirection(d){
 if(!game)return;
 const me=game.players.find(p=>p.id===peer?.id||p.id==="solo");
 if(!me||!me.alive||!validDirection(me.dir,d))return;
 if(isHost)me.dir=d;
 else if(conn&&conn.open)conn.send({type:"dir",dir:d});
}
function joystickDirection(dx,dy){
 if(Math.hypot(dx,dy)<13)return;
 if(Math.abs(dx)>Math.abs(dy))sendDirection({x:dx>0?1:-1,y:0});
 else sendDirection({x:0,y:dy>0?1:-1});
}
const joy=$("joystick"),knob=$("knob");
joy.addEventListener("pointerdown",e=>{
 joystickPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);
});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joystickPointer)moveJoy(e)});
function moveJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=42,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joystickDirection(dx,dy);
}
function releaseJoy(e){
 if(e.pointerId!==joystickPointer)return;
 joystickPointer=null;knob.style.transform="translate(0,0)";
}
joy.addEventListener("pointerup",releaseJoy);
joy.addEventListener("pointercancel",releaseJoy);
window.addEventListener("keydown",e=>{
 const keys={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},
 ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};
 if(keys[e.key]){e.preventDefault();sendDirection(keys[e.key])}
});
if(profile)refreshProfile();
const invite=new URLSearchParams(location.search).get("room");
if(invite){$("roomInput").value=invite;setTimeout(()=>joinRoom(),700)}
</script>
</body>
</html>
